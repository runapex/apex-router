<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apex studio · Metro</title>
<style>
  :root {
    --bg: #1a1b26; --card: #24283b; --fg: #c0caf5; --muted: #a9b1d6; --soft: #9aa5ce; --rule: #3b4261;
    --blue: #7aa2f7; --cyan: #7dcfff; --purple: #bb9af7; --amber: #e0af68; --red: #f7768e;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  .num { font-family: var(--mono); }

  /* top bar */
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; }
  #status { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; }
  #status .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); }
  body.problem #status { color: var(--red); }
  body.problem #status .dot { background: var(--red); }
  nav { display: flex; gap: 10px; }
  nav button { position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rule);
    background: var(--card); color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  nav button:hover, nav button:focus-visible { color: var(--fg); border-color: var(--soft); outline: none; }
  nav button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); box-shadow: 0 0 12px rgba(192,202,245,.35); }
  nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
    background: var(--fg); color: #1a1b26; font: 600 12px/20px var(--mono); }

  /* main: map + optional panel */
  main { display: grid; grid-template-columns: 1fr; min-height: 0; }
  body.panel-open main { grid-template-columns: 1fr 400px; }
  #map { width: 100%; height: 100%; display: block; min-height: 0; }
  aside { display: none; background: var(--card); border-left: 1px solid var(--rule); padding: 22px 24px; overflow: auto; }
  body.panel-open aside { display: block; }
  aside h2 { margin: 0 0 4px; font-size: 20px; }
  aside .sub { color: var(--soft); margin: 0 0 16px; font-size: 14px; }
  aside ul { list-style: none; padding: 0; margin: 0 0 18px; }
  aside li { padding: 9px 0; border-bottom: 1px solid var(--rule); color: var(--muted); }
  aside li b { color: var(--fg); font-weight: 600; }
  aside .close { float: right; background: none; border: 0; color: var(--soft); font-size: 22px; cursor: pointer; }
  .action { display: inline-block; margin-top: 4px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--fg);
    background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  .action:hover { background: rgba(192,202,245,.08); }
  .req { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .req:hover, .req.sel { color: var(--fg); }
  .req .swatch { display: inline-block; width: 22px; height: 6px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 8px; border: 1px solid var(--rule); color: var(--soft); white-space: nowrap; }
  .chip.wait { color: var(--amber); border-color: var(--amber); }
  .fail { color: var(--red); }
  /* inner steps of the interchange: a mini line */
  .steps { position: relative; margin: 6px 0 20px; padding-left: 26px; }
  .steps::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 6px; border-radius: 3px; background: var(--blue); }
  .steps div { position: relative; padding: 5px 0; color: var(--fg); font-size: 15px; }
  .steps div::before { content: ""; position: absolute; left: -22px; top: 9px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--fg); }
  /* tokens picture */
  .tok { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin: 10px 0 8px; }
  .tok span { height: 46px; border-radius: 6px; border: 2px solid var(--blue); }
  .tok span.c { background: var(--blue); }
  .tokkey { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }

  /* svg map */
  .lbl { fill: var(--fg); font-size: 20px; font-weight: 600; }
  .cap { fill: var(--soft); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
  .route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .station { cursor: pointer; }
  .station:hover .pill, .station:focus .pill { stroke: #fff; }
  .station:focus { outline: none; }
  .pill { fill: var(--bg); stroke: var(--fg); stroke-width: 5; }
  .dim { opacity: .15; }
  .dimtext { opacity: .62; }
  .focus { filter: url(#glow); }
  #disrupt { display: none; }
  body.problem #disrupt { display: inline; }
  .train { fill: #fff; }
  .train.bad { fill: var(--red); }
  @media (prefers-reduced-motion: reduce) { #trains { display: none; } }
</style>
</head>
<body>
<header>
  <div id="status" role="status"><span class="dot"></span><span id="statusText">All good. Last request <span class="num">4</span> s ago.</span></div>
  <nav aria-label="More">
    <button data-panel="recent" title="Recent requests" aria-label="Recent requests" aria-pressed="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
    <button data-panel="changes" title="Changes" aria-label="Changes, 2 waiting" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span class="badge">2</span></button>
    <button data-panel="experiments" title="Experiments" aria-label="Experiments" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7.5 15h9"/></svg></button>
    <button data-panel="tokens" title="Tokens" aria-label="Tokens" aria-pressed="false">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></button>
  </nav>
</header>

<main>
<svg id="map" viewBox="0 110 1440 600" preserveAspectRatio="xMidYMid meet" aria-label="Metro map: your agents ride through apex to AI providers">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text class="cap" x="230" y="130" text-anchor="middle">Your agents</text>
  <text class="cap" x="1180" y="130" text-anchor="middle">AI providers</text>

  <!-- records spur (neutral) -->
  <g id="g-records">
    <path d="M705,440 V640" stroke="#737aa2" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- lines: drawn by JS (width = log traffic) -->
  <g id="routes"></g>
  <g id="disrupt">
    <path d="M1000,570 H1150" stroke="#1a1b26" stroke-width="16"/>
    <path d="M1000,570 H1150" stroke="#f7768e" stroke-width="6" stroke-dasharray="8 8"/>
    <g transform="translate(1075,570)">
      <circle r="17" fill="#1a1b26" stroke="#f7768e" stroke-width="4"/>
      <path d="M0,-8 V3 M0,8 V9" stroke="#f7768e" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="1075" y="625" text-anchor="middle" fill="#f7768e" font-size="18" font-weight="600">Service disruption</text>
    <text x="1075" y="650" text-anchor="middle" fill="#c0caf5" font-size="17">Provider not reached</text>
  </g>
  <g id="trains"></g>
  <g id="stations"></g>
</svg>
<aside id="panel" aria-live="polite"></aside>
</main>

<script>
(() => {
  // ---------- mock data (inline) ----------
  const LINES = {
    cc:    { name: 'Claude Code', color: '#bb9af7' },
    pi:    { name: 'pi',          color: '#7aa2f7' },
    codex: { name: 'Codex',       color: '#7dcfff' },
  };
  // a route = one journey agent -> apex -> provider. n = requests in the last 15 min
  const ROUTES = {
    'cc':       { line: 'cc',    n: 22, to: 'claude', d: 'M230,210 H470 L625,365 H785 L940,210 H1180' },
    'pi-claude':{ line: 'pi',    n: 40, to: 'claude', d: 'M230,390 H880 L1030,240 H1180' },
    'pi-mac':   { line: 'pi',    n: 6,  to: 'mac',    d: 'M230,390 H1180' },
    'codex':    { line: 'codex', n: 9,  to: 'gpt',    d: 'M230,570 H470 L625,415 H785 L940,570 H1180' },
  };
  const MAXN = 46;
  const width = n => 3 + 13 * Math.pow(Math.log(1 + n) / Math.log(1 + MAXN), 2); // log scale, max 16 px

  const NODES = {
    cc:     { kind: 'agent', x: 230, y: 210, label: 'Claude Code', routes: ['cc'] },
    pi:     { kind: 'agent', x: 230, y: 390, label: 'pi', routes: ['pi-claude', 'pi-mac'] },
    codex:  { kind: 'agent', x: 230, y: 570, label: 'Codex', routes: ['codex'] },
    apex:   { kind: 'hub',   x: 705, y: 390, label: 'apex', routes: Object.keys(ROUTES) },
    claude: { kind: 'end',   x: 1180, y: 225, h: 70, label: 'Claude models', routes: ['cc', 'pi-claude'] },
    mac:    { kind: 'end',   x: 1180, y: 390, h: 40, label: 'Models on this Mac', routes: ['pi-mac'] },
    gpt:    { kind: 'end',   x: 1180, y: 570, h: 40, label: 'GPT models', routes: ['codex'] },
    records:{ kind: 'rec',   x: 705, y: 650, label: 'Records', routes: [] },
  };

  const FACTS = {
    apex: { title: 'apex', sub: 'Interchange · the relay on this Mac', steps: ['Who is calling', 'Model choice', 'Safety blocks', 'Send and retry', 'Answer and token count'],
      facts: ['It passes and counts each request. It keeps no prompt text.', 'Last request: <b>pi → Claude models</b>, 4 s ago.',
              'Model choice: task looks like code, so <b>Claude Sonnet</b>.', 'Typical wait: <b>1.4 s</b>.', '77 requests in the last 15 min.'],
      action: 'Show recent requests', act: () => openPanel('recent'), light: 'pi-claude' },
    pi: { title: 'pi', sub: 'Agent · line in blue', facts: ['46 requests in the last 15 min.', 'Most go to Claude models. Some stay on this Mac.', 'Agent add-ons: Plain-English rules, Safety blocks, Memory summary.', '2 helper agents run now.', 'Typical wait: 1.3 s.'], action: 'Light its last request', act: () => select('pi-claude') },
    cc: { title: 'Claude Code', sub: 'Agent · line in purple', facts: ['22 requests in the last 15 min.', 'All go to Claude models.', 'Typical wait: 1.6 s.', 'No errors.', 'Last request 9 s ago.'], action: 'Light its last request', act: () => select('cc') },
    codex: { title: 'Codex', sub: 'Agent · line in cyan', facts: ['9 requests in the last 15 min.', 'All go to GPT models.', 'Codex cache helper: on.', 'Typical wait: 2.1 s.', 'Last request 35 s ago.'], action: 'Light its last request', act: () => select('codex') },
    claude: { title: 'Claude models', sub: 'Provider · terminus', facts: ['62 requests in the last 15 min.', 'Claude Sonnet and Claude Opus.', 'Sign-in (Azure): managed.', 'Provider load: OK.', 'No errors.'], action: 'Test with one prompt', act: () => {} },
    mac: { title: 'Models on this Mac', sub: 'Provider · terminus', facts: ['6 requests in the last 15 min.', 'Nothing leaves this Mac on this line.', 'Typical wait: 0.6 s.', 'Provider load: OK.', 'No errors.'], action: 'Test with one prompt', act: () => {} },
    gpt: { title: 'GPT models', sub: 'Provider · terminus', facts: ['9 requests in the last 15 min.', 'Provider load: OK.', 'Typical wait: 2.1 s.', 'No errors.', 'Used by Codex only.'], action: 'Test with one prompt', act: () => {} },
    gptBad: { title: 'GPT models', sub: 'Service disruption', facts: ['<span class="fail">3 of 10 requests fail.</span>', 'Cause: <b>provider not reached</b>.', 'Send and retry tries 2 times, then stops.', 'Codex waits longer: 6.2 s.', 'Started 12 min ago.'], action: 'Test GPT models now', act: () => {} },
    records: { title: 'Records', sub: 'What apex writes down on this Mac', facts: ['Counts, health and history only.', 'No prompt text, no keys.', 'Last written 10 s ago.', 'Request log and Model-choice log.', 'Menu-bar history.'], action: 'Open the folder', act: () => {} },
  };

  const RECENT = [
    { r: 'pi-claude', t: '4 s' }, { r: 'cc', t: '9 s' }, { r: 'pi-mac', t: '21 s' }, { r: 'codex', t: '35 s', bad: true }, { r: 'cc', t: '1 min' },
  ];

  // ---------- draw ----------
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
  const gRoutes = document.getElementById('routes'), gTrains = document.getElementById('trains'), gSt = document.getElementById('stations');

  // pi trunk carries both pi routes: draw it as one band with the summed width
  const trunk = el('path', { d: 'M230,390 H880', class: 'route', stroke: LINES.pi.color, 'stroke-width': width(46), 'data-r': 'pi-claude pi-mac' }, gRoutes);
  const routeEls = {};
  for (const [k, r] of Object.entries(ROUTES)) {
    routeEls[k] = el('path', { d: r.d, class: 'route', stroke: LINES[r.line].color, 'stroke-width': width(r.n), 'data-r': k }, gRoutes);
  }

  for (const [k, n] of Object.entries(NODES)) {
    const g = el('g', { class: 'station', tabindex: 0, role: 'button', 'data-node': k, 'aria-label': n.label }, gSt);
    if (n.kind === 'agent') {
      el('circle', { cx: n.x, cy: n.y, r: 15, class: 'pill' }, g);
      el('text', { x: n.x - 30, y: n.y + 7, class: 'lbl', 'text-anchor': 'end' }, g).textContent = n.label;
    } else if (n.kind === 'hub') {
      el('rect', { x: n.x - 60, y: n.y - 55, width: 120, height: 110, rx: 30, class: 'pill', 'stroke-width': 6 }, g);
      el('text', { x: n.x, y: n.y + 2, class: 'lbl', 'text-anchor': 'middle', 'font-size': 28 }, g).textContent = n.label;
      // 5 small dots = the inner steps; a click opens them
      for (let i = 0; i < 5; i++) el('circle', { cx: n.x - 32 + i * 16, cy: n.y + 28, r: 4, fill: '#9aa5ce' }, g);
    } else if (n.kind === 'end') {
      el('rect', { x: n.x - 16, y: n.y - n.h / 2, width: 32, height: n.h, rx: 16, class: 'pill' }, g);
      el('text', { x: n.x + 32, y: n.y + 7, class: 'lbl' }, g).textContent = n.label;
    } else {
      el('rect', { x: n.x - 12, y: n.y - 12, width: 24, height: 24, rx: 6, class: 'pill', stroke: '#9aa5ce' }, g);
      el('text', { x: n.x + 26, y: n.y + 7, class: 'lbl', fill: '#a9b1d6' }, g).textContent = n.label;
    }
    g.addEventListener('click', () => openNode(k));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openNode(k); } });
  }

  // ---------- trains (live traffic) ----------
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const trains = [];
  if (!reduce) {
    for (const [k, r] of Object.entries(ROUTES)) {
      const p = routeEls[k], len = p.getTotalLength();
      const count = Math.max(1, Math.round(Math.log2(1 + r.n)));   // more trains on busy lines
      for (let i = 0; i < count; i++) {
        const c = el('circle', { r: Math.max(4.5, width(r.n) / 2 + 1), class: 'train', 'data-r': k }, gTrains);
        trains.push({ c, p, len, k, off: (i / count + (k.length % 3) * 0.13) % 1, bad: k === 'codex' && i % 3 === 0 });
      }
    }
    const speed = 150; // px per second
    let t0 = null;
    const tick = ts => {
      if (t0 === null) t0 = ts;
      const s = (ts - t0) / 1000;
      for (const t of trains) {
        let f = (t.off + s * speed / t.len) % 1;
        let dist = f * t.len;
        const broken = state === 'problem' && t.bad;
        if (broken && dist > 893) dist = 893;                // stops at the break
        t.c.classList.toggle('bad', broken && dist >= 893);
        const pt = t.p.getPointAtLength(dist);
        t.c.setAttribute('cx', pt.x); t.c.setAttribute('cy', pt.y);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // ---------- focus: light one journey, dim the rest ----------
  let selected = null;
  function select(rk) {
    selected = rk;
    const keep = rk ? [rk] : null;
    document.querySelectorAll('#routes .route, #trains .train').forEach(e => {
      const rs = e.getAttribute('data-r').split(' ');
      const on = !keep || rs.some(r => keep.includes(r));
      e.classList.toggle('dim', !on);
      e.classList.toggle('focus', !!keep && on && e.tagName === 'path');
    });
    const onNodes = rk ? ['apex', ...Object.keys(NODES).filter(n => NODES[n].routes.includes(rk) && n !== 'apex')] : null;
    document.querySelectorAll('#stations .station').forEach(g => {
      const k = g.getAttribute('data-node');
      g.classList.toggle('dimtext', !!onNodes && !onNodes.includes(k));
    });
    document.getElementById('g-records').classList.toggle('dim', !!rk);
    document.querySelectorAll('.req').forEach(li => li.classList.toggle('sel', li.dataset.r === rk));
  }

  // ---------- panel ----------
  const panel = document.getElementById('panel');
  const navBtns = document.querySelectorAll('nav button');
  function show(html, which) {
    panel.innerHTML = '<button class="close" aria-label="Close">×</button>' + html;
    panel.querySelector('.close').onclick = closePanel;
    document.body.classList.add('panel-open');
    navBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.panel === which)));
  }
  function closePanel() { document.body.classList.remove('panel-open'); navBtns.forEach(b => b.setAttribute('aria-pressed', 'false')); select(null); }

  function openNode(k) {
    const f = (k === 'gpt' && state === 'problem') ? FACTS.gptBad : FACTS[k];
    let h = `<h2>${f.title}</h2><p class="sub">${f.sub}</p>`;
    if (f.steps) h += '<div class="steps">' + f.steps.map(s => `<div>${s}</div>`).join('') + '</div>';
    h += '<ul>' + f.facts.slice(0, 5).map(x => `<li>${x}</li>`).join('') + '</ul>';
    h += `<button class="action">${f.action}</button>`;
    show(h, null);
    panel.querySelector('.action').onclick = f.act;
    select(f.light || null);
  }

  function openPanel(which) {
    let h = '';
    if (which === 'recent') {
      h = '<h2>Recent requests</h2><p class="sub">Pick one to light its journey.</p><ul>' + RECENT.map(q => {
        const r = ROUTES[q.r], bad = q.bad && state === 'problem';
        return `<li class="req" data-r="${q.r}" tabindex="0"><span><span class="swatch" style="background:${LINES[r.line].color}"></span>${LINES[r.line].name} → ${NODES[r.to].label}</span><span class="${bad ? 'fail' : ''}">${bad ? 'failed' : q.t}</span></li>`;
      }).join('') + '</ul>';
    } else if (which === 'changes') {
      h = '<h2>Changes</h2><p class="sub">2 settings wait to apply.</p><ul>' +
        '<li class="req"><span><b>Retries per request</b>: 3 → 2</span><span class="chip">applies now</span></li>' +
        '<li class="req"><span><b>Local relay</b>: new address</span><span class="chip wait">waits until idle</span></li>' +
        '</ul><p class="sub">Busy requests now: 3. Running agents do not break.</p><button class="action">Review and apply</button>';
    } else if (which === 'experiments') {
      h = '<h2>Experiments</h2><p class="sub">Tests that do not change your requests.</p><ul>' +
        '<li class="req"><span><b>JEPA</b> model-choice test</span><span class="chip">paused</span></li>' +
        '<li class="req"><span><b>Gold labels</b>: 85 % checked</span><span class="chip wait">provisional</span></li>' +
        '<li class="req"><span><b>Savings estimate</b> (test only)</span><span class="chip">off</span></li>' +
        '<li class="req"><span><b>Second-opinion scores</b></span><span class="chip">collecting</span></li></ul>';
    } else if (which === 'tokens') {
      const blocks = Array.from({ length: 12 }, (_, i) => `<span class="${i < 9 ? 'c' : ''}"></span>`).join('');
      h = '<h2>Tokens</h2><p class="sub">Input tokens, last 24 h. One block = 0.1 M.</p>' +
        `<div class="tok" role="img" aria-label="Of 1.2 M input tokens, 0.9 M came from cache">${blocks}</div>` +
        '<div class="tokkey"><span>■ from cache <b class="num">0.9 M</b></span><span>□ sent new <b class="num">0.3 M</b></span></div>' +
        '<p style="font-size:18px;margin:18px 0">Of <b class="num">1.2 M</b> input tokens, <b class="num">0.9 M</b> came from cache.</p>';
    }
    show(h, which);
    panel.querySelectorAll('.req[data-r]').forEach(li => {
      li.onclick = () => select(li.dataset.r);
      li.onkeydown = e => { if (e.key === 'Enter') select(li.dataset.r); };
    });
  }
  navBtns.forEach(b => b.addEventListener('click', () => {
    if (b.getAttribute('aria-pressed') === 'true') closePanel(); else openPanel(b.dataset.panel);
  }));

  // ---------- states via URL hash ----------
  let state = 'ok';
  function apply() {
    const h = location.hash.replace('#', '');
    state = ['ok', 'problem', 'detail'].includes(h) ? h : 'ok';
    document.body.classList.toggle('problem', state === 'problem');
    const st = document.getElementById('statusText');
    if (state === 'problem') {
      st.innerHTML = 'Problem: GPT models fail <span class="num">3</span> of <span class="num">10</span> requests.';
      routeEls.codex.setAttribute('stroke-dasharray', '');
    } else {
      st.innerHTML = 'All good. Last request <span class="num">4</span> s ago.';
    }
    const gptPill = document.querySelector('[data-node="gpt"] .pill');
    gptPill.style.stroke = state === 'problem' ? '#f7768e' : '';
    if (state === 'detail') openNode('apex'); else closePanel();
  }
  addEventListener('hashchange', apply);
  apply();
})();
</script>
</body>
</html>
