<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apex studio · River</title>
<style>
  :root{
    --bg:#1a1b26; --card:#24283b; --fg:#c0caf5; --muted:#a9b1d6; --line:#2f344d;
    --flow:#7aa2f7;   /* meaning 1: traffic */
    --focus:#7dcfff;  /* meaning 2: focus (one glow) */
    --warn:#e0af68;   /* meaning 3: warn */
    --err:#f7768e;    /* meaning 4: error */
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden}
  .num{font-family:var(--mono)}
  header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;
    border-bottom:1px solid var(--line)}
  #status{font-size:22px;font-weight:500;letter-spacing:.1px}
  #status .bad{color:var(--err);font-weight:600}
  .icons{display:flex;gap:10px}
  .icon{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
  .icon:hover,.icon:focus-visible{color:var(--fg);outline:none;border-color:var(--muted)}
  .icon[aria-pressed="true"]{color:var(--focus);border-color:var(--focus);box-shadow:0 0 10px -2px var(--focus)}
  .icon svg{width:20px;height:20px}
  .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--fg);
    color:var(--bg);font:600 11px/18px var(--mono);text-align:center;padding:0 4px}
  main{display:flex;height:calc(100% - 72px)}
  #stage{flex:1;min-width:0;position:relative}
  svg#river{width:100%;height:100%;display:block}
  .lbl{fill:var(--fg);font-size:19px}
  .lbl.col{fill:var(--muted);font-size:15px;letter-spacing:1.5px;text-transform:uppercase}
  .lbl.small{font-size:15px;fill:var(--muted)}
  .lbl.err{fill:var(--err)}
  .node{cursor:pointer}
  .node:hover .lbl{fill:#fff}
  .dim{opacity:.35}
  aside{width:0;overflow:hidden;transition:width .2s;background:var(--card);border-left:1px solid var(--line)}
  aside.open{width:360px}
  .panel{width:360px;padding:28px 28px}
  .panel h2{margin:0;font-size:22px;font-weight:600}
  .panel .sub{color:var(--muted);margin:2px 0 20px;font-size:15px}
  .panel ul{list-style:none;margin:0 0 24px;padding:0}
  .panel li{padding:10px 0;border-top:1px solid var(--line);font-size:16px}
  .panel li b{font-family:var(--mono);font-weight:600}
  .split{height:16px;border-radius:8px;overflow:hidden;display:flex;margin:4px 0 20px}
  .split i{display:block;height:100%}
  .btn{background:transparent;color:var(--fg);border:1px solid var(--muted);border-radius:8px;padding:10px 14px;
    font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--fg)}
  .close{float:right;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .pop{position:absolute;top:64px;right:32px;width:340px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:18px 20px;z-index:5;display:none;box-shadow:0 12px 30px #0008}
  .pop.open{display:block}
  .pop h3{margin:0 0 10px;font-size:17px}
  .pop li{list-style:none;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
  .pop ul{margin:0;padding:0}
  .pop .tag{float:right;color:var(--muted);font-size:13px}
  .pop .tag.wait{color:var(--warn)}
  @media (prefers-reduced-motion: reduce){ aside{transition:none} }
</style>
</head>
<body>
<header>
  <div id="status" role="status" aria-live="polite">All good. Last request <span class="num">4</span> s ago.</div>
  <div class="icons">
    <button class="icon" id="bChanges" aria-label="Changes waiting" title="Changes" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span class="badge num">2</span>
    </button>
    <button class="icon" id="bExp" aria-label="Experiments" title="Experiments" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/></svg>
    </button>
    <button class="icon" id="bTok" aria-label="Show tokens instead of requests" title="Tokens" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
    </button>
  </div>
  <div class="pop" id="popChanges" role="dialog" aria-label="Changes">
    <h3>2 changes waiting</h3>
    <ul>
      <li>Retries per request: 3 → 4 <span class="tag">applies now</span></li>
      <li>Default model: Claude Sonnet <span class="tag wait">waits until idle</span></li>
    </ul>
    <p style="margin:14px 0 0"><button class="btn">Review changes</button></p>
  </div>
  <div class="pop" id="popExp" role="dialog" aria-label="Experiments">
    <h3>Experiments</h3>
    <ul>
      <li>Prompt predictor (JEPA) <span class="tag">paused</span></li>
      <li>Gold labels: 85 % done <span class="tag wait">provisional</span></li>
      <li>Savings estimate (test only) <span class="tag">off</span></li>
    </ul>
  </div>
</header>
<main>
  <div id="stage"><svg id="river" viewBox="0 0 1360 760" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Traffic flows from your agents through apex to AI providers"></svg></div>
  <aside id="aside" aria-label="Details"><div class="panel" id="panel"></div></aside>
</main>
<script>
(() => {
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("river");
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const C = {flow:"#7aa2f7", focus:"#7dcfff", warn:"#e0af68", err:"#f7768e", fg:"#c0caf5", muted:"#a9b1d6"};

/* ---------- mock data (last 15 min) ---------- */
const DATA = {
  agents: [
    {id:"pi",    name:"pi",          req:60, tok:0.70},
    {id:"cc",    name:"Claude Code", req:34, tok:0.35},
    {id:"codex", name:"Codex",       req:18, tok:0.15},
  ],
  providers: [
    {id:"claude", name:"Claude models",      req:64, tok:0.20},
    {id:"gpt",    name:"GPT models",         req:36, tok:0.08},
    {id:"local",  name:"Models on this Mac", req:12, tok:0.02},
  ],
  tokens:{in:1.2, cache:0.9, sent:0.3},
};
const FACTS = {
  apex:{title:"apex", sub:"Local relay on this Mac · last 15 min", split:true,
    facts:[["<b>1.2 M</b> input tokens came in"],["<b>0.9 M</b> came from cache"],["<b>0.3 M</b> sent to providers"],
           ["Typical wait <b>1.4 s</b>"],["Keeps counts, not your prompts"]], action:"Show last 20 requests"},
  pi:{title:"pi", sub:"Your agent · last 15 min",
    facts:[["<b>60</b> requests"],["Mostly to Claude models"],["Uses Model choice (>> tag)"],["Typical wait <b>1.2 s</b>"]], action:"Show pi requests"},
  cc:{title:"Claude Code", sub:"Your agent · last 15 min",
    facts:[["<b>34</b> requests"],["All to Claude models"],["Typical wait <b>1.6 s</b>"]], action:"Show Claude Code requests"},
  codex:{title:"Codex", sub:"Your agent · last 15 min",
    facts:[["<b>18</b> requests"],["All to GPT models"],["Codex cache helper is on"]], action:"Show Codex requests"},
  claude:{title:"Claude models", sub:"AI provider · Anthropic",
    facts:[["<b>64</b> requests, none failed"],["Typical wait <b>1.4 s</b>"],["Provider load: OK"]], action:"Show Claude requests"},
  gpt:{title:"GPT models", sub:"AI provider · OpenAI",
    facts:[["<b>36</b> requests, none failed"],["Typical wait <b>1.1 s</b>"],["Provider load: OK"]], action:"Show GPT requests"},
  gptBad:{title:"GPT models", sub:"AI provider · OpenAI", bad:true,
    facts:[["<b>3 of 10</b> requests fail"],["Cause: provider not reached"],["apex retries each one up to 3 times"],["Started 6 min ago"],["Other providers: OK"]], action:"Send GPT traffic to Claude models"},
  local:{title:"Models on this Mac", sub:"AI provider · local",
    facts:[["<b>12</b> requests, none failed"],["Nothing leaves this Mac"],["Typical wait <b>2.3 s</b>"]], action:"Show local requests"},
  rec:{title:"Records", sub:"Written on this Mac",
    facts:[["Last written <b>4 s</b> ago"],["Request log, model-choice log"],["Counts and health only, no prompts"]], action:"Open records folder"},
};

/* ---------- state ---------- */
const S = {state:"ok", tokens:false, sel:null};
function readHash(){
  const h = (location.hash||"#ok").slice(1);
  S.state = ["ok","problem","detail"].includes(h) ? h : "ok";
  S.tokens = S.state === "detail";
  S.sel = S.state === "detail" ? "apex" : null;
}

/* ---------- geometry ---------- */
const AX0 = 620, AX1 = 662;          // apex gate
const SX = 232;                       // agent spring x (band start)
const DX = 1020, NX = 1150;           // delta start, node x
const AY = [180, 370, 560];           // agent centres
const PY = [180, 370, 560];           // provider centres
const MID = 370;
const TX = 860, LX = 900;             // token mode: trunk end, cache lake end
const RY = 716, RFX = 1062;           // records stream y, fold x
const lg = (v, unit, k) => Math.max(6, k * Math.log2(Math.max(1.5, v / unit)));   // log width

function bez(a,b,c,d,t){const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d;}
function band(x0,t0,b0,x1,t1,b1){                       // area between two horizontal-tangent cubics
  const xm=(x0+x1)/2;
  return {x0,t0,b0,x1,t1,b1,xm,
    d:`M${x0},${t0} C${xm},${t0} ${xm},${t1} ${x1},${t1} L${x1},${b1} C${xm},${b1} ${xm},${b0} ${x0},${b0} Z`,
    at(s,f){const x=bez(x0,xm,xm,x1,s);const yt=bez(t0,t0,t1,t1,s),yb=bez(b0,b0,b1,b1,s);return [x,yt+(yb-yt)*f];}};
}

function layout(){
  const tok = S.tokens;
  const aw = DATA.agents.map(a => tok ? lg(a.tok,0.01,11) : lg(a.req,4,22));
  const inTot = aw.reduce((a,b)=>a+b,0);
  const gTop = MID - inTot/2, gBot = MID + inTot/2;
  const L = {aw, inTot, gTop, gBot, ins:[], outs:[], deltas:[], cache:null, rec:null};
  // inflow: agents -> apex (stacked at the gate)
  let y = gTop;
  DATA.agents.forEach((a,i)=>{ const w=aw[i];
    L.ins.push({id:a.id, b:band(SX,AY[i]-w/2,AY[i]+w/2,AX0,y,y+w), rate:a.req}); y+=w; });
  // outflow
  let outTop = gTop, outH = inTot, OX = AX1;
  if (tok){ // the river forks: a narrow "sent to provider" trunk on top, a calm "from cache" lake below
    const sentH = inTot * DATA.tokens.sent / DATA.tokens.in;     // share of one band: drawn linear
    outH = sentH; OX = TX;
    const cTop = gTop + sentH;
    L.trunk = band(AX1, gTop, cTop, TX, gTop, cTop);
    L.cache = band(AX1, cTop, gBot, LX, 552, 552 + (gBot-cTop));
    L.sentTop = gTop; L.sentBot = cTop;
  }
  const pwRaw = DATA.providers.map(p => tok ? lg(p.tok,0.01,10) : lg(p.req,4,22));
  const k = outH / pwRaw.reduce((a,b)=>a+b,0);
  const pw = pwRaw.map(w=>w*k);
  y = outTop;
  DATA.providers.forEach((p,i)=>{ const w=pw[i];
    L.outs.push({id:p.id, b:band(OX,y,y+w,DX,PY[i]-w/2,PY[i]+w/2), w, rate:p.req}); y+=w;
    // delta: 3 fingers fan out and thin
    const fw=[.45,.33,.22], spread=Math.max(26,w*1.5), gap=spread/3; let fy=PY[i]-w/2, fingers=[];
    fw.forEach((f,j)=>{ const sw=w*f, ew=Math.max(1.5,sw*.55), ec=PY[i]-gap+j*gap;
      fingers.push(band(DX,fy,fy+sw,NX-8,ec-ew/2,ec+ew/2)); fy+=sw; });
    L.deltas.push(fingers);
  });
  // records: a thin stream drops from the gate foot, runs along the bottom, then folds
  const rx=(AX0+AX1)/2;
  L.rec = `M${rx},${gBot+8} C${rx},${RY} ${rx},${RY} ${rx+90},${RY} L${RFX},${RY}`;
  return L;
}

/* ---------- draw ---------- */
function el(tag, attrs, parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}
function txt(x,y,s,cls,anchor,parent){const t=el("text",{x,y,class:"lbl "+(cls||""),"text-anchor":anchor||"start","dominant-baseline":"middle"},parent);t.textContent=s;return t;}

let particles=[], spray=[], flows=[], L;
function draw(){
  svg.innerHTML=""; particles=[]; spray=[]; flows=[];
  L = layout();
  const prob = S.state==="problem";
  const defs = el("defs",{});
  defs.innerHTML = `
    <linearGradient id="gIn" x1="0" x2="1"><stop offset="0" stop-color="${C.flow}" stop-opacity=".22"/><stop offset="1" stop-color="${C.flow}" stop-opacity=".42"/></linearGradient>
    <linearGradient id="gOut" x1="0" x2="1"><stop offset="0" stop-color="${C.flow}" stop-opacity=".42"/><stop offset="1" stop-color="${C.flow}" stop-opacity=".3"/></linearGradient>
    <linearGradient id="gBreak" x1="0" x2="1"><stop offset="0" stop-color="${C.flow}" stop-opacity=".42"/><stop offset=".55" stop-color="${C.flow}" stop-opacity=".35"/><stop offset="1" stop-color="${C.err}" stop-opacity=".75"/></linearGradient>
    <linearGradient id="gCache" x1="0" x2="1"><stop offset="0" stop-color="${C.flow}" stop-opacity=".28"/><stop offset="1" stop-color="${C.flow}" stop-opacity=".1"/></linearGradient>
    <pattern id="still" width="40" height="9" patternUnits="userSpaceOnUse"><path d="M0 4.5h22" stroke="${C.fg}" stroke-opacity=".16" stroke-width="1.2"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

  // column names
  txt(SX-22, 72, "Your agents", "col", "end");
  txt(NX+14, 72, "AI providers", "col", "start");

  const gFlow = el("g",{});
  const gDots = el("g",{});
  const gTop = el("g",{});
  const sel = S.sel;

  // inflows
  L.ins.forEach((f,i)=>{
    el("path",{d:f.b.d, fill:"url(#gIn)", class:(sel&&sel!=="apex"&&sel!==f.id)?"dim":""}, gFlow);
    flows.push({b:f.b, n:Math.round(f.rate/2.2), sp:.11, col:C.flow});
  });

  // outflows + deltas
  L.outs.forEach((f,i)=>{
    const bad = prob && f.id==="gpt";
    const dimIt = sel && sel!=="apex" && sel!==f.id;
    if (!bad){
      el("path",{d:f.b.d, fill:"url(#gOut)", class:dimIt?"dim":""}, gFlow);
      L.deltas[i].forEach(d=>el("path",{d:d.d, fill:C.flow, "fill-opacity":.3, class:dimIt?"dim":""}, gFlow));
      flows.push({b:f.b, n:Math.round(f.rate/2.2), sp:.1, col:C.flow});
      L.deltas[i].forEach(d=>flows.push({b:d, n:Math.max(1,Math.round(f.rate/9)), sp:.32, col:C.flow}));
    } else {
      // the band breaks: solid to the break, a gap, then a thinner 70 % band goes on
      const b=f.b, BS=.62, BE=.74;
      const p0=b.at(BS,0), p1=b.at(BS,1), q0=b.at(BE,0), q1=b.at(BE,1);
      const brk = band(b.x0,b.t0,b.b0,p0[0],p0[1],p1[1]);
      el("path",{d:brk.d, fill:"url(#gBreak)"}, gFlow);
      const w=(q1[1]-q0[1]), cut=w*.15;
      const rest = band(q0[0],q0[1]+cut,q1[1]-cut,b.x1,b.t1+cut,b.b1-cut);
      el("path",{d:rest.d, fill:C.flow, "fill-opacity":.22}, gFlow);
      L.deltas[i].forEach(d=>el("path",{d:d.d, fill:C.flow, "fill-opacity":.18}, gFlow));
      // ragged edge at the break
      let rag=`M${p0[0]},${p0[1]}`; const steps=7;
      for(let s=1;s<=steps;s++){const yy=p0[1]+(p1[1]-p0[1])*s/steps; rag+=` L${p0[0]+(s%2?10:-2)},${yy}`;}
      el("path",{d:rag, stroke:C.err, "stroke-width":2.5, fill:"none", "stroke-linejoin":"round"}, gFlow);
      flows.push({b:brk, n:12, sp:.1, col:C.flow});
      flows.push({b:rest, n:6, sp:.07, col:C.flow});
      L.deltas[i].forEach(d=>flows.push({b:d, n:1, sp:.25, col:C.flow}));
      L.breakAt = {x:p0[0], y0:p0[1], y1:p1[1]};
      // static spray (also the reduced-motion picture)
      for(let s=0;s<16;s++){
        const yy=p0[1]+(p1[1]-p0[1])*Math.random(), ang=(Math.random()-.5)*1.6, len=8+Math.random()*22, dx=14+Math.random()*30;
        const x0=p0[0]+dx*.4, y0=yy, x1=x0+Math.cos(ang)*len, y1=y0+Math.sin(ang)*len;
        el("line",{x1:x0,y1:y0,x2:x1,y2:y1, stroke:C.err, "stroke-width":2, "stroke-linecap":"round", "stroke-opacity":(.35+Math.random()*.5).toFixed(2)}, gFlow);
      }
      // plain cause next to the break
      const ly = p1[1] + 34;
      txt(p0[0]-6, ly, "Provider not reached.", "err", "start", gTop);
      txt(p0[0]-6, ly+24, "apex retries.", "small", "start", gTop);
    }
  });

  // trunk + cache lake (token mode)
  if (L.cache){
    const c=L.cache, t=L.trunk;
    el("path",{d:t.d, fill:"url(#gOut)"}, gFlow);
    flows.push({b:t, n:6, sp:.12, col:C.flow});
    el("path",{d:c.d, fill:"url(#gCache)"}, gFlow);
    el("path",{d:`M${LX},${c.t1} C${LX+70},${c.t1} ${LX+70},${c.b1} ${LX},${c.b1} Z`, fill:C.flow, "fill-opacity":.1}, gFlow);
    el("path",{d:c.d, fill:"url(#still)"}, gFlow);
    flows.push({b:c, n:5, sp:.02, col:C.fg, calm:true});
    const my=(c.t1+c.b1)/2;
    txt(LX-170, my-12, "from cache", "", "start", gTop);
    txt(LX-170, my+14, "0.9 M of 1.2 M", "small num", "start", gTop);
    txt(AX1+18, t.t0-30, "sent to provider", "", "start", gTop);
    txt(AX1+18, t.t0-10, "0.3 M", "small num", "start", gTop);
  }

  // records: thin stream, then folded
  const recP = el("path",{d:L.rec, stroke:C.flow, "stroke-opacity":.45, "stroke-width":4, fill:"none", class:(sel&&sel!=="rec"&&sel!=="apex")?"dim":""}, gFlow);
  flows.push({path:recP, len:recP.getTotalLength(), n:3, sp:.05, col:C.flow, small:true});
  const gRec = el("g",{class:"node", tabindex:0, "data-id":"rec", role:"button", "aria-label":"Records"});
  const fx=RFX, fy=RY-3;            // accordion fold
  const fold=[[fx,fy,fx+16,fy-10],[fx+16,fy-10,fx+30,fy+12],[fx+30,fy+12,fx+44,fy-8],[fx+44,fy-8,fx+56,fy+8]];
  fold.forEach((s,i)=>el("path",{d:`M${s[0]},${s[1]} L${s[2]},${s[3]} L${s[2]},${s[3]+6} L${s[0]},${s[1]+6} Z`,
    fill:C.flow, "fill-opacity":i%2?.55:.3}, gRec));
  el("rect",{x:fx-6,y:fy-24,width:180,height:50,fill:"transparent"},gRec);
  txt(NX+14, fy+3, "Records", "", "start", gRec);

  // agent springs + labels
  DATA.agents.forEach((a,i)=>{
    const w=L.aw[i], g=el("g",{class:"node"+((sel&&sel!=="apex"&&sel!==a.id)?" dim":""), tabindex:0, "data-id":a.id, role:"button", "aria-label":a.name});
    el("rect",{x:SX-10,y:AY[i]-w/2,width:10,height:w,rx:5,fill:C.flow,"fill-opacity":.7},g);
    el("rect",{x:40,y:AY[i]-w/2,width:SX-40,height:w,fill:"transparent"},g);
    txt(SX-22, AY[i], a.name, "", "end", g);
  });

  // provider nodes
  DATA.providers.forEach((p,i)=>{
    const bad = prob && p.id==="gpt";
    const g=el("g",{class:"node"+((sel&&sel!=="apex"&&sel!==p.id)?" dim":""), tabindex:0, "data-id":p.id, role:"button", "aria-label":p.name});
    const h=Math.max(26, L.outs[i].w*1.5)+10;
    el("rect",{x:NX-8,y:PY[i]-h/2,width:4,height:h,rx:2,fill:bad?C.err:C.flow,"fill-opacity":bad?1:.7},g);
    el("rect",{x:NX-10,y:PY[i]-h/2,width:220,height:h,fill:"transparent"},g);
    txt(NX+14, PY[i], p.name, bad?"err":"", "start", g);
  });

  // apex gate
  const ga = el("g",{class:"node", tabindex:0, "data-id":"apex", role:"button", "aria-label":"apex, local relay on this Mac"});
  const focus = sel==="apex";
  el("rect",{x:AX0,y:L.gTop-8,width:AX1-AX0,height:L.inTot+16,rx:12,fill:"#24283b",
    stroke:focus?C.focus:C.muted, "stroke-width":focus?2.5:1.5, filter:focus?"url(#glow)":""},ga);
  if (L.cache){ // the split line inside the gate
    el("line",{x1:AX0+6,x2:AX1-6,y1:L.sentBot,y2:L.sentBot,stroke:focus?C.focus:C.muted,"stroke-width":1.5,"stroke-dasharray":"3 3"},ga);
  }
  txt((AX0+AX1)/2, L.gTop-34, "apex", "", "middle", ga).setAttribute("style","font-size:22px;font-weight:600"+(focus?";fill:"+C.focus:""));

  // particles
  if (!RM){
    flows.forEach(f=>{ for(let k=0;k<f.n;k++){
      const c=el("circle",{r:f.small?1.6:(f.calm?2.2:2.4), fill:f.col, "fill-opacity":f.calm?.35:.85}, gDots);
      particles.push({c,f,s:Math.random(),lane:.12+Math.random()*.76, v:f.sp*(.8+Math.random()*.4)});
    }});
  }
  gTop.parentNode.appendChild(gTop);

  // node clicks
  svg.querySelectorAll(".node").forEach(n=>{
    const open=()=>{S.sel = S.sel===n.dataset.id ? null : n.dataset.id; if(S.sel==="apex")S.tokens=true; sync();};
    n.addEventListener("click",open);
    n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
  });
}

/* ---------- motion ---------- */
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  particles.forEach(p=>{
    p.s+=p.v*dt*(p.f.path?400/p.f.len:400/Math.max(60,p.f.b.x1-p.f.b.x0))*.9;
    if(p.s>1){p.s-=1;p.lane=.12+Math.random()*.76;}
    const [x,y]=p.f.path?(q=>[q.x,q.y])(p.f.path.getPointAtLength(p.s*p.f.len)):p.f.b.at(p.s,p.lane); p.c.setAttribute("cx",x.toFixed(1)); p.c.setAttribute("cy",y.toFixed(1));
  });
  // red spray at the break
  if (S.state==="problem" && L && L.breakAt){
    if (Math.random()<.6){
      const b=L.breakAt, y=b.y0+(b.y1-b.y0)*Math.random();
      const c=el("circle",{r:2.2,fill:C.err},svg);
      spray.push({c,x:b.x+4,y,vx:40+Math.random()*90,vy:(Math.random()-.5)*120,life:0});
    }
    spray=spray.filter(s=>{s.life+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=60*dt;
      const a=1-s.life/1.1; if(a<=0){s.c.remove();return false;}
      s.c.setAttribute("cx",s.x.toFixed(1)); s.c.setAttribute("cy",s.y.toFixed(1)); s.c.setAttribute("fill-opacity",a.toFixed(2)); return true;});
  }
  requestAnimationFrame(tick);
}

/* ---------- chrome ---------- */
const statusEl=document.getElementById("status"), aside=document.getElementById("aside"), panel=document.getElementById("panel");
function sync(){
  document.getElementById("bTok").setAttribute("aria-pressed", S.tokens);
  statusEl.innerHTML = S.state==="problem"
    ? `<span class="bad">Problem.</span> GPT models fail <span class="num">3</span> of <span class="num">10</span> requests.`
    : `All good. Last request <span class="num">4</span> s ago.`;
  if (S.sel){
    const key = (S.sel==="gpt" && S.state==="problem") ? "gptBad" : S.sel, F=FACTS[key];
    const T=DATA.tokens, cw=(T.cache/T.in*100).toFixed(0);
    panel.innerHTML = `<button class="close" aria-label="Close">×</button><h2${F.bad?' style="color:'+C.err+'"':''}>${F.title}</h2>
      <div class="sub">${F.sub}</div>
      ${F.split?`<div class="split" aria-hidden="true"><i style="width:${cw}%;background:${C.flow};opacity:.35"></i><i style="flex:1;background:${C.flow}"></i></div>`:""}
      <ul>${F.facts.map(f=>`<li>${f[0]}</li>`).join("")}</ul><button class="btn">${F.action}</button>`;
    panel.querySelector(".close").onclick=()=>{S.sel=null; sync();};
    aside.classList.add("open");
  } else aside.classList.remove("open");
  draw();
}
function pop(id,btn){
  const p=document.getElementById(id), open=!p.classList.contains("open");
  document.querySelectorAll(".pop").forEach(x=>x.classList.remove("open"));
  document.querySelectorAll("#bChanges,#bExp").forEach(b=>b.setAttribute("aria-pressed","false"));
  if(open){p.classList.add("open");btn.setAttribute("aria-pressed","true");}
}
document.getElementById("bChanges").onclick=e=>pop("popChanges",e.currentTarget);
document.getElementById("bExp").onclick=e=>pop("popExp",e.currentTarget);
document.getElementById("bTok").onclick=()=>{S.tokens=!S.tokens; sync();};
addEventListener("hashchange",()=>{readHash();sync();});
readHash(); sync();
if(!RM) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
