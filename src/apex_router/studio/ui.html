<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>apex studio</title>
<style nonce="__NONCE__">
:root{
  /* Tokyo Night. Text roles keep WCAG AA (>= 4.5:1) on --card. 4 colours carry a meaning:
     line hue = which agent (identity, like metro line colours; not a state), focus = white, slow = amber, error = red.
     Grey is neutral (no meaning). */
  --bg:#1a1b26;--bg-dark:#16161e;--card:#24283b;--card2:#292e42;--rule:#3b4261;--neutral:#737aa2;
  --fg:#c0caf5;--fg2:#a9b1d6;--soft:#9aa5ce;--focus:#ffffff;--amber:#e0af68;--red:#f7768e;
  --l-claude:#bb9af7;--l-pi:#7aa2f7;--l-codex:#7dcfff;--l-other:#8a93b8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans)}
body{display:grid;grid-template-rows:auto 1fr;overflow:hidden;min-width:1024px;min-height:700px}
button,input,select{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#sprite{position:absolute;width:0;height:0;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar: status sentence + 4 icons */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 26px}
#status{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;min-width:0}
#status .dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:var(--fg)}
#status-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status.lvl-slow{color:var(--amber)} #status.lvl-slow .dot{background:var(--amber)}
#status.lvl-problem{color:var(--red)} #status.lvl-problem .dot{background:var(--red)}
#status.lvl-wait{color:var(--soft)} #status.lvl-wait .dot{background:transparent;border:2px solid var(--neutral)}
nav{display:flex;gap:10px;flex:0 0 auto}
nav button{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--card);
  color:var(--fg2);cursor:pointer;display:grid;place-items:center;padding:0}
nav button:hover{color:var(--fg);border-color:var(--soft)}
nav button[aria-pressed="true"]{color:var(--fg);border-color:var(--focus);box-shadow:0 0 12px rgba(255,255,255,.25)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:var(--fg);color:var(--bg-dark);font:600 12px/20px var(--mono)}
.badge[hidden]{display:none}

/* map + panel */
main{display:grid;grid-template-columns:1fr;min-height:0;position:relative}
body.panel-open main{grid-template-columns:1fr 410px}
@media (max-width:1199px){ body.panel-open main{grid-template-columns:1fr 350px} .pb{padding:0 18px 22px} .ph{padding:18px 18px 6px} }
#panel{display:none;background:var(--card);border-left:1px solid var(--rule);overflow:auto;min-height:0}
body.panel-open #panel{display:block}
.ph{position:sticky;top:0;z-index:2;background:var(--card);display:flex;align-items:flex-start;gap:10px;padding:20px 22px 6px}
.ph h2{margin:0;font-size:21px;flex:1;outline:none}
.x{flex:0 0 auto;background:transparent;border:1px solid var(--rule);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--fg2)}
.x:hover{color:var(--fg);border-color:var(--soft)}
.pb{padding:0 22px 26px}
.sub{color:var(--soft);margin:0 0 14px}
.pb h3{margin:20px 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.facts{list-style:none;padding:0;margin:0 0 14px}
.facts li{padding:8px 0;border-bottom:1px solid var(--rule);color:var(--fg2)}
.facts b{color:var(--fg);font-weight:600}
.btn{background:var(--card2);border:1px solid var(--rule);border-radius:9px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--soft)}
.btn.main{border-color:var(--fg);color:var(--fg);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;font-size:12.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--fg2);white-space:nowrap}
.chip.now{border-color:var(--fg);color:var(--fg)}
.chip.restart{border-style:dashed;border-color:var(--soft);color:var(--fg2)}
.chip.fixed,.chip.off{color:var(--soft)}
.chip.on{border-color:var(--fg);color:var(--fg)}
.chip.failed,.fail{color:var(--red);border-color:var(--red)}
.chip.slowc{color:var(--amber);border-color:var(--amber)}
.chip.running{border-color:var(--fg);color:var(--fg)}
.chip.provisional{border-style:dashed}
.muted{color:var(--soft)} .small{font-size:13px}
.code{font-family:var(--mono);font-size:12.5px;color:var(--soft);overflow-wrap:anywhere}
.empty{color:var(--soft);font-style:italic}
.msg{padding:9px 12px;border-radius:9px;margin:10px 0;border:1px solid var(--rule);background:var(--card2)}
.msg.err{border-color:var(--red)}
details{margin-top:8px} summary{cursor:pointer;color:var(--fg2);font-size:13.5px}
pre.diff,pre.cmds{margin:6px 0 0;padding:8px 10px;font:12px/1.45 var(--mono);background:var(--bg-dark);border-radius:8px;overflow:auto;white-space:pre}
pre.cmds{white-space:pre-wrap;overflow-wrap:anywhere}
pre.diff .p{color:var(--fg)} pre.diff .m{color:var(--soft);text-decoration:line-through} pre.diff .h{color:var(--neutral)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 12px;cursor:pointer;color:var(--fg2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--fg)}

/* recent */
.reqs{list-style:none;margin:0;padding:0}
.reqs li{border-bottom:1px solid var(--rule)}
.req{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:9px 4px;cursor:pointer;color:var(--fg2);text-align:left}
.req:hover,.req[aria-pressed="true"]{color:var(--fg)}
.req[aria-pressed="true"]{font-weight:600}
.req .way{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:inline-block;flex:0 0 auto;width:24px;height:7px;border-radius:4px}
.hops{margin:0 0 12px 34px;padding:0;list-style:none;color:var(--fg2);font-size:14px}
.hops li{padding:3px 0;border:0}

/* tokens picture */
.tline{margin:14px 0 4px;display:flex;justify-content:space-between;gap:10px;color:var(--fg2)}
.tline b{color:var(--fg)}
.tbar{display:flex;height:22px;border-radius:6px;overflow:hidden;min-width:6px}
.tbar.big{height:42px;border-radius:9px}
.tbar .c{height:100%;flex:0 0 auto} .tbar .n{height:100%;flex:1 1 auto;border:2px solid;border-left:0;border-radius:0 6px 6px 0}
.tbar.big .n{border-radius:0 9px 9px 0}
.obar{height:6px;border-radius:3px;margin-top:4px;min-width:3px}
.tkey{display:flex;gap:18px;color:var(--soft);font-size:13px;margin:8px 0 0}
.tkey i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;background:var(--fg)}
.tkey i.h{background:transparent;border:2px solid var(--fg)}
.tkey i.o{height:5px;vertical-align:2px}
.headline{font-size:19px;margin:14px 0 14px}
.headline b{white-space:nowrap;font-variant-numeric:tabular-nums}

/* records: speed, wait, disk, and the pipelines branch */
.rate{font-size:19px;margin:12px 0 2px}
.rate b{font-variant-numeric:tabular-nums;white-space:nowrap}
.rate2{color:var(--soft);font-size:13.5px;margin:0 0 12px}
.dbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--bg-dark);margin:10px 0 6px}
.dbar .a{height:100%;background:var(--fg2)} .dbar .z{height:100%;background:var(--neutral)}
.dkey{display:flex;gap:18px;color:var(--fg2);font-size:13.5px;margin:0 0 6px;flex-wrap:wrap}
.dkey i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.dkey i.a{background:var(--fg2)} .dkey i.z{background:var(--neutral)}
.branch{list-style:none;margin:6px 0 10px;padding:0 0 0 4px;position:relative}
.branch::before{content:"";position:absolute;left:13px;top:12px;bottom:18px;width:5px;border-radius:2px;
  background:repeating-linear-gradient(var(--neutral) 0 3px,transparent 3px 9px)}
.branch li{position:relative;padding:5px 0 9px 34px}
.branch .stop{position:absolute;left:5px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--card);border:3px solid var(--fg2)}
.branch li.root .stop{border-radius:5px;border-color:var(--neutral)}
.branch li.late .stop{border-color:var(--amber)} .branch li.bad .stop{border-color:var(--red)}
.branch li.off .stop{border-color:var(--neutral);border-style:dashed}
.branch .pn{color:var(--fg);font-weight:600}
.branch .ps{color:var(--fg2);font-size:13.5px}
.branch li.late .ps{color:var(--amber)} .branch li.bad .ps{color:var(--red)}
.branch .pm{color:var(--soft);font-size:13px}

/* experiments board */
.board{list-style:none;padding:0;margin:0}
.board li{padding:12px 0;border-bottom:1px solid var(--rule)}
.board .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.board .nm{font-weight:600;color:var(--fg)}
.board .hl{color:var(--fg2);margin:3px 0 2px}
.board .fr{color:var(--soft);font-size:13px}

/* apex inner line */
.inner{list-style:none;margin:4px 0 10px;padding:0 0 0 4px;position:relative}
.inner::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--l-pi)}
.step{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:6px 4px;cursor:pointer;color:var(--fg);text-align:left;border-radius:8px}
.step:hover{background:var(--card2)}
.step .stop{position:relative;flex:0 0 auto;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--fg)}
.step .sn{flex:1}
.step.off .stop,.step.fixed .stop{border-color:var(--neutral)} .step.off .sn{color:var(--soft)}
.step.lit .stop{border-color:var(--focus);box-shadow:0 0 8px rgba(255,255,255,.6)} .step.lit .sn{font-weight:600}
.step.dimmed{opacity:.45}
.back{background:transparent;border:0;color:var(--fg2);cursor:pointer;padding:4px 0;margin:4px 0 6px}
.back:hover{color:var(--fg)}
.card{border:1px solid var(--rule);border-radius:11px;padding:11px 13px;margin:10px 0;background:var(--card2)}
.card.waits{border-color:var(--fg)}
.card .tt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .tt b{font-weight:600}
.card .help{color:var(--soft);font-size:13px;margin:3px 0 6px}
.vals{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--fg2);margin:4px 0}
.vals .v{font-family:var(--mono);color:var(--fg);overflow-wrap:anywhere}
.edit{display:flex;gap:6px;margin-top:8px}
.edit input,.edit select,.rs input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:6px 9px}
/* apex: the live decision line (one station per decision; a train moves station to station) */
.dline{list-style:none;margin:6px 0 4px;padding:0 0 0 4px;position:relative}
.dline::before{content:"";position:absolute;left:13px;top:12px;bottom:16px;width:4px;border-radius:2px;background:var(--rule)}
.dline li{position:relative;padding:4px 0 8px 34px;min-height:22px}
.dline .stop{position:absolute;left:6px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--fg2)}
.dline .dn{color:var(--fg);font-weight:600;margin-right:8px}
.dline .dv{color:var(--fg2)}
.dline .dw{display:block;font-size:13px}
.dline li.none .stop{border-color:var(--neutral)} .dline li.none .dv{color:var(--soft)}
.dline li.wait .stop{border-color:var(--neutral)} .dline li.wait .dv{visibility:hidden}
.dline li.warn .stop{border-color:var(--amber)} .dline li.warn .dv,.dline li.warn .dw{color:var(--amber)}
.dline li.error .stop{border-color:var(--red)} .dline li.error .dv,.dline li.error .dw{color:var(--red)}
.dline li.here .stop{background:var(--focus);border-color:var(--focus);box-shadow:0 0 10px rgba(255,255,255,.7)}
.dline .train{position:absolute;left:8px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--focus);
  transition:transform .15s linear;pointer-events:none}
.dline.small li{padding:2px 0 4px 34px;min-height:18px}
.dline.small .stop{top:5px;width:12px;height:12px}
.dline.small::before{top:10px}
.dhead{color:var(--soft);font-size:13px;margin:0 0 2px}
.rs{margin-top:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
.rs input[type=number]{flex:0 0 80px;width:80px}
.tgt{border:1px solid var(--rule);border-radius:11px;margin:12px 0;padding:10px 12px;background:var(--card2)}
.chg{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
.rm{background:transparent;border:1px solid var(--rule);border-radius:7px;color:var(--fg2);cursor:pointer;padding:1px 8px}

/* workflows: the main view. Each workflow is a block; sessions, tasks and sub-agents are Metro lines
   with stations (the icon is the station). Line hue = agent (identity). State = a ring colour, never the icon. */
#wf{overflow:auto;min-height:0;padding:4px 26px 90px}
#wf h1{margin:6px 0 12px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:600;
  display:flex;gap:12px;align-items:baseline}
#wf h1 .win{letter-spacing:0;text-transform:none;font-weight:400}
.wfs{list-style:none;margin:0;padding:0;max-width:1180px}
.wfb{background:var(--card);border:1px solid var(--rule);border-radius:14px;margin:0 0 12px;padding:6px 10px 6px}
.wfb.run{border-color:var(--soft)}
.fold{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;background:transparent;border:0;padding:4px 6px;
  cursor:pointer;color:var(--fg);text-align:left;border-radius:9px}
.fold:hover{background:var(--card2)}
.fold .chev{flex:0 0 auto;width:10px;height:10px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);
  transform:rotate(-45deg);margin:0 4px 0 2px;transition:transform .15s}
.fold[aria-expanded="true"] .chev{transform:rotate(45deg)}
.fold .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .mt{color:var(--soft);font-size:13.5px;white-space:nowrap;margin-left:auto;padding-left:12px}
.fold .cause{font-size:13.5px;white-space:nowrap}
.wfh{font-size:17px}
.icons{display:flex;gap:4px;flex:0 0 auto}
.ico{width:20px;height:20px;flex:0 0 auto;display:block;border-radius:50%}
.ico.big{width:32px;height:32px}
.dot0{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--card);border:3px solid var(--neutral)}
/* state rings: amber = slow or stalled, red = failed or stopped; running = a white pulse */
.ring-amber{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--amber)}
.ring-red{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--red)}
.ring-run{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--focus);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--bg),0 0 0 4px rgba(255,255,255,.95)}
  50%{box-shadow:0 0 0 2px var(--bg),0 0 0 6px rgba(255,255,255,.35)}}
.amber{color:var(--amber)} .red{color:var(--red)}
/* a Metro line: one segment per station, so the line ends at the last station */
.mline{list-style:none;margin:0 0 4px;padding:0 0 0 18px}
.mline>li{position:relative;padding:0 0 0 22px}
.mline>li::before{content:"";position:absolute;left:7.5px;top:0;height:18px;width:5px;background:var(--hue,var(--rule))}
.mline>li:first-child::before{display:none}
.mline>li:not(:last-child)::after{content:"";position:absolute;left:7.5px;top:18px;bottom:0;width:5px;background:var(--hue,var(--rule))}
.mline>li>.row1{position:relative;left:-22px;display:flex;align-items:center;gap:10px;min-height:36px}
.mline>li>.row1>.fold{flex:1;min-width:0;padding-left:0}
.mline>li>.row1>.stn{position:relative;z-index:1;flex:0 0 auto}
.stn{display:block}
.stn .tstop{display:block;width:20px;height:20px;border-radius:50%;background:var(--card);border:4px solid var(--hue,var(--fg2))}
.hue-pi{--hue:var(--l-pi)} .hue-claude{--hue:var(--l-claude)} .hue-codex{--hue:var(--l-codex)} .hue-other{--hue:var(--l-other)}
.sel{width:18px;height:18px;margin:0;accent-color:var(--fg);cursor:pointer;flex:0 0 auto}
.mini{background:transparent;border:1px solid var(--rule);border-radius:8px;color:var(--fg2);cursor:pointer;padding:2px 10px;
  font-size:13.5px;white-space:nowrap}
.mini:hover{color:var(--fg);border-color:var(--soft)}
.verd{font-size:12.5px;padding:0 8px;border-radius:999px;border:1px solid var(--rule);color:var(--fg2)}
.verd.go{border-color:var(--fg);color:var(--fg)} .verd.nogo{border-color:var(--amber);color:var(--amber)}
.more{color:var(--soft);font-size:13.5px;margin:0;padding:6px 0 8px 0}
.mline>li.mr>.row1 .tstop{border-style:dashed;border-color:var(--neutral)}
.live{margin:0 0 6px 0}
.live .dline li{padding:2px 0 4px 34px;min-height:20px}
.live .dline .stop{top:5px;width:12px;height:12px}
.live .dline .dn .ico{display:inline-block;vertical-align:-5px;margin-right:6px}
.wfmore{margin:6px 0 0}
.msg.inline{display:inline-block;margin:0 0 10px}
#joinbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;gap:10px;align-items:center;
  padding:8px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--soft);box-shadow:0 6px 20px rgba(0,0,0,.5)}
#joinbar[hidden]{display:none}
.branch .stn{position:absolute;left:5px;top:6px;z-index:1}
.branch li.off .ico{opacity:.6}
.req .ico{margin-left:-4px}

/* toast */
#toast{position:fixed;right:26px;top:72px;z-index:40;max-width:620px;display:none;padding:8px 12px;border-radius:9px;background:var(--card);
  border:1px solid var(--rule);color:var(--fg2)}
#toast.show{display:block} #toast.err{border-color:var(--red);color:var(--fg)}

@media (prefers-reduced-motion: reduce){
  .dline .train{display:none}
  .ring-run{animation:none}
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
__ICONS__
<header>
  <div id="status" class="lvl-wait" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status-text">Connecting…</span></div>
  <nav aria-label="Panels">
    <button type="button" data-panel="records" title="Records" aria-label="Records" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg></button>
    <button type="button" data-panel="tokens" title="Tokens" aria-label="Tokens" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></button>
    <button type="button" data-panel="experiments" title="Experiments" aria-label="Experiments" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7.5 15h9"/></svg></button>
    <button type="button" data-panel="changes" title="Changes" aria-label="Changes" aria-pressed="false" id="nav-changes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span class="badge" id="badge" hidden></span></button>
  </nav>
</header>
<main>
  <section id="wf" aria-labelledby="wf-title"></section>
  <aside id="panel" aria-labelledby="panel-title"></aside>
</main>
<div id="joinbar" role="region" aria-label="Selected sessions" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script nonce="__NONCE__">
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const NS = "http://www.w3.org/2000/svg";
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- plain names (research-1 section 5) ---------- */
const AGENTS = [
  {k: "claude", name: "Claude Code", color: "#bb9af7", shade: "purple", node: "src.claude"},
  {k: "pi", name: "pi", color: "#7aa2f7", shade: "blue", node: "src.pi"},
  {k: "codex", name: "Codex", color: "#7dcfff", shade: "cyan", node: "src.codex"},
  {k: "other", name: "Other", color: "#8a93b8", shade: "grey", node: null},
];
const PROVIDERS = [
  {k: "anthropic", name: "Claude models", node: "up.anthropic"},
  {k: "ollama", name: "Models on this Mac", node: "up.ollama"},
  {k: "openai", name: "GPT models", node: "up.openai"},
];
const PROV_OF = {anthropic: "anthropic", foundry: "anthropic", openai: "openai", "foundry-gpt": "openai",
  ollama: "ollama", local: "ollama", "up.anthropic": "anthropic", "up.openai": "openai", "up.ollama": "ollama"};
const provKey = p => PROV_OF[p] || null;
const agentKey = a => (a === "pi" || a === "claude" || a === "codex") ? a : "other";
const agentOf = k => AGENTS.find(a => a.k === k) || AGENTS[3];
const provOf = k => PROVIDERS.find(p => p.k === k);
const STEP = {
  "src.pi": ["pi", "Your pi agent."], "src.claude": ["Claude Code", "Your Claude Code agent."], "src.codex": ["Codex", "Your Codex agent."],
  cue: ["Model choice", "Reads a >>tag in your prompt and picks the model group."],
  resolve: ["Automatic model choice", "Looks at the task and picks a model when no tag is set."],
  ste: ["Plain-English rules", "Adds short plain-English writing rules to the system prompt."],
  guards: ["Safety blocks", "Stops tool calls on the deny list and stops hung commands."],
  compact: ["Memory summary", "Keeps rules and ids when pi shortens a long chat."],
  agents: ["Helper agents", "Starts helper agents. Holds them when providers are overloaded."],
  detect: ["Who is calling", "Finds which agent sent the request."],
  shadow: ["Savings estimate (test only)", "Estimates possible savings. It does not change the request."],
  cachekey: ["Codex cache helper", "Gives Codex a stable cache key, so more input comes from cache."],
  auth: ["Sign-in (Azure)", "Adds an Azure sign-in when the agent sent none."],
  upstream: ["Send and retry", "Sends the request. Tries again only when the provider was not reached."],
  response: ["Answer and token count", "Streams the answer back and counts tokens and wait time."],
  "up.anthropic": ["Claude models", ""], "up.openai": ["GPT models", ""], "up.ollama": ["Models on this Mac", ""],
  "sink.telemetry": ["Request log", ""], "sink.routelog": ["Model-choice log", ""], "sink.pressure": ["Provider load", ""],
  "sink.history": ["Menu-bar history", ""], "sink.xval": ["Second-opinion scores", ""],
};
const CLIENT_STEPS = ["cue", "resolve", "ste", "guards", "compact", "agents"];
const STATIONS = [["task", "Task"], ["model", "Model"], ["guard", "Safety"], ["cache", "Cache"], ["send", "Send"], ["answer", "Answer"]];
const STATION_OF = Object.fromEntries(STATIONS);
const STATION_MS = 150, LIT_MAX = 10;
const PROXY_STEPS = ["detect", "shadow", "cachekey", "auth", "upstream", "response"];
const SETTING_TITLE = {
  APEX_ROUTE_TABLE: "Model-choice table file", min_confidence: "Least confidence for an automatic choice",
  APEX_STE: "Plain-English rules on", APEX_GUARD: "Safety blocks on", APEX_HANGGUARD: "Stop hung commands",
  APEX_PI_BASH_TIMEOUT: "Command time limit (s)", APEX_GUARDRULES_FILE: "Deny-list file",
  APEX_COMPACT: "Memory summary on", APEX_COMPACT_CACHE: "Use the cache for the summary",
  APEX_COMPACT_SUMMARY_TOKENS: "Summary size (tokens)", APEX_AGENT_CAP: "Helper agents at the same time",
  APEX_AGENT_MAX_DEPTH: "Helper levels", APEX_SHADOW: "Savings estimate on", APEX_POLICY_PATH: "Policy file",
  APEX_CODEX_CACHE_KEY: "Codex cache helper on", APEX_CODEX_CACHE_KEY_SHARDS: "Codex cache groups",
  APEX_INJECT_AZURE_TOKEN: "Azure sign-in on", APEX_AZURE_TOKEN_RESOURCE: "Azure sign-in target",
  APEX_CONNECT_TIMEOUT: "Time to reach the provider (s)", APEX_READ_TIMEOUT: "Longest wait for an answer (s)",
  APEX_CONNECT_RETRIES: "Retries per request", APEX_CONNECT_BACKOFF: "Pause between retries (s)",
  APEX_RETRY_POLICY: "What a retry does", APEX_RETRY_WAIT_MS: "Least wait before a retry (ms)",
  APEX_ANTHROPIC_UPSTREAM: "Claude models address", APEX_OPENAI_UPSTREAM: "GPT models address",
  APEX_TTFT_BUDGET_MS: "Delay budget for apex (ms)", APEX_TELEMETRY_KEEP: "Old request logs to keep",
  APEX_HEARTBEAT_S: "Health signal every (s)",
};
const WHEN = {live: "applies now", restart: "applies after a safe restart", locked: "fixed"};
const WHEN_CLS = {live: "now", restart: "restart", locked: "fixed"};

/* ---------- state ---------- */
const S = {snap: null, lastSnap: 0, stale: "", recent: [], seen: new Set(), flow: null, live: null,
  draft: null, review: null, proxy: "main", panel: null, arg: null, focus: null, selReq: null,
  flowQ: [], flowRun: null, flowT: 0, fl: null, stepsOpen: false, tok: null, tokWin: "15m", exps: null, recs: null,
  pollMode: false, wfWin: "24h"};

/* ---------- helpers (text only: textContent, never HTML) ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c === null || c === undefined || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
const $ = id => document.getElementById(id);
const qa = sel => Array.from(document.querySelectorAll(sel));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nowS = () => Date.now() / 1000;
function median(v){ if (!v.length) return null; const s = v.slice().sort((a, b) => a - b); const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function ago(ts){
  if (!ts) return "—";
  const s = Math.max(0, Math.round(nowS() - ts));
  if (s < 90) return s + " s"; if (s < 5400) return Math.round(s / 60) + " min";
  if (s < 172800) return Math.round(s / 3600) + " h"; return Math.round(s / 86400) + " days";
}
function secs(ms){ if (ms === null || ms === undefined || !isFinite(ms)) return "—";
  return ms < 10000 ? (ms / 1000).toFixed(1) + " s" : Math.round(ms / 1000) + " s"; }
function big(n){ n = +n || 0; if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + " M";
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + " k"; return String(Math.round(n)); }
function pct(a, b){ return b > 0 ? Math.round(100 * a / b) : 0; }

async function api(path, opts){
  opts = opts || {};
  const init = {method: opts.method || "GET", headers: {"X-Studio-Token": TOKEN}, cache: "no-store", signal: opts.signal || null};
  if (opts.body !== undefined){ init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const r = await fetch(path, init);
  let j = null; try { j = await r.json(); } catch (e) { j = null; }
  if (!r.ok){ const err = new Error((j && j.error) || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return j;
}
let toastT = 0;
function toast(text, err){ const b = $("toast"); b.textContent = text || ""; b.className = text ? ("show" + (err ? " err" : "")) : "";
  clearTimeout(toastT); if (text) toastT = setTimeout(() => toast(""), 7000); }

/* ---------- requests (recent list + stream items) ---------- */
function norm(r){
  if (!r || typeof r !== "object") return null;
  const a = agentKey(r.agent), p = provKey(r.provider);
  const t = r.tokens && typeof r.tokens === "object" ? r.tokens : {};
  return {id: String(r.id || (r.ts + ":" + r.agent)), ts: +r.ts || nowS(), a, p, key: a + "|" + p,
    family: typeof r.model_family === "string" ? r.model_family : "", status: r.status === "error" || r.status === "retried" ? r.status : "ok",
    cause: typeof r.cause === "string" ? r.cause : "", ms: +r.ms_total || null, ttft: +r.ttft_ms || null,
    tin: +t.in || 0, tout: +t.out || 0, cr: +t.cache_read || 0, cw: +t.cache_write || 0, dec: normDec(r.decisions)};
}
function normDec(ds){
  const by = {};
  for (const d of Array.isArray(ds) ? ds.slice(0, 6) : []){
    if (!d || typeof d !== "object" || !STATION_OF[d.step]) continue;
    by[d.step] = {verdict: typeof d.verdict === "string" ? d.verdict.slice(0, 80) : "—",
      state: ["ok", "warn", "error", "none"].includes(d.state) ? d.state : "none"};
  }
  return STATIONS.map(([k]) => by[k] || {verdict: "—", state: "none"});
}
function addRequests(items, live){
  const fresh = [];
  for (const raw of items){
    const r = norm(raw); if (!r || S.seen.has(r.id)) continue;
    S.seen.add(r.id); S.recent.push(r); fresh.push(r);
  }
  if (!fresh.length) return;
  S.recent.sort((x, y) => y.ts - x.ts);
  if (S.recent.length > 200){ for (const r of S.recent.splice(200)) S.seen.delete(r.id); }
  // the flow paints from S.recent: start it only after the sort, so the newest request and "Last 10" are right
  if (live) for (const r of fresh) flowStart(r);
  if (S.panel === "recent" || S.panel === "agent" || S.panel === "provider") renderPanelSoon();
}

/* ---------- lines: one per agent -> provider ---------- */
const SLOW_MS = 8000;
const aIdx = k => AGENTS.findIndex(a => a.k === k);
function judge(o){
  if (o.ghost) return {state: "ok"};
  const rs = S.recent.filter(r => r.key === o.key && nowS() - r.ts < 900);
  if (o.err_pct >= 10){
    const c = S.recent.find(r => r.key === o.key && r.status === "error" && r.cause);
    return {state: "problem", cause: c ? c.cause : "Requests fail"};
  }
  const t = rs.filter(r => r.status !== "error" && r.ttft > 0).slice(0, 20).map(r => r.ttft);
  const med = median(t);
  if (t.length >= 3 && med >= SLOW_MS) return {state: "slow", cause: "First word after " + Math.round(med / 1000) + " s"};
  if (o.err_pct >= 2) return {state: "slow", cause: "Some requests fail"};
  return {state: "ok"};
}
function currentLines(){
  const out = [], by = new Map();
  for (const l of (S.snap && Array.isArray(S.snap.lines) ? S.snap.lines : [])){
    const a = agentKey(l.agent), p = provKey(l.provider); if (!p) continue;
    const key = a + "|" + p, prev = by.get(key);
    if (prev){ prev.rpm += +l.rpm || 0; prev.err_pct = Math.max(prev.err_pct, +l.err_pct || 0); continue; }
    const o = {key, a, p, rpm: +l.rpm || 0, err_pct: +l.err_pct || 0};
    by.set(key, o); out.push(o);
  }
  for (const o of out) Object.assign(o, judge(o));
  return out;
}

/* ---------- icons: one <use> of the sprite the server put in the page; the name comes from its <title> ---------- */
const ROLE_ICON = {worker: "role-worker", xval: "role-xval", scout: "role-scout", reviewer: "role-reviewer", coordinator: "role-coordinator"};
const AGENT_ICON = {pi: "agent-pi", claude: "agent-claude", codex: "agent-codex"};
const PROC_ICON = {menubar: "proc-snapshot", daily: "proc-daily", archive: "proc-drain", pressure: "proc-mesh",
  offload: "proc-local-proxy", worldmodel: "proc-collect", records: "proc-serve"};
function icon(id, big, ring){
  const sym = id ? document.getElementById(id) : null;
  const t = sym && sym.querySelector("title");
  if (!sym || !t) return null;                       // no sprite: the row keeps its text
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("class", "ico" + (big ? " big" : "") + (ring ? " " + ring : ""));
  s.setAttribute("viewBox", "0 0 32 32");
  s.setAttribute("role", "img");
  s.setAttribute("aria-label", t.textContent);
  const u = document.createElementNS(NS, "use");
  u.setAttribute("href", "#" + id);
  s.append(u);
  return s;
}
function iconOr(id, big, ring){
  return icon(id, big, ring) || h("span", {class: "dot0" + (ring ? " " + ring : ""), "aria-hidden": "true"});
}
const agentIcon = (k, big, ring) => iconOr(AGENT_ICON[k] || null, big, ring);
const roleIcon = (r, ring) => iconOr(ROLE_ICON[r] || "role-worker", false, ring);
const procIcon = (k, ring) => iconOr(PROC_ICON[k] || "proc-serve", false, ring);
function modelId(text){
  const t = String(text || "").toLowerCase();
  if (/opus/.test(t)) return "model-opus";
  if (/sonnet|haiku|fable|claude/.test(t)) return "model-sonnet";
  if (/\bsol\b/.test(t)) return "model-gpt-sol";
  if (/gpt/.test(t)) return "model-gpt";
  if (/qwen|llama|gemma|mistral|deepseek|kimi|glm|phi|local/.test(t)) return "model-local";
  return null;
}
const modelIcon = text => { const id = modelId(text); return id ? icon(id, false) : null; };

/* ---------- workflows (contract: API.md "Workflows") ---------- */
// every fixed text of screen 1 (budget: 25 words or fewer, the 6 station names included; names, causes and
// numbers are data). The test counts the words of these strings.
const SCREEN1 = {
  stations: "Task Model Safety Cache Send Answer",
  subs: "sub-agents",
  ago: "ago",
  split: "Split",
  title: "Workflows",
  w24: "24 h",
  w7: "7 days",
  more7: "Show 7 days",
  less7: "Show 24 h",
  empty: "No work yet.",
  slow: "Loading…",
  more: "more"
};
const plusMore = n => "+" + Math.max(0, Math.round(+n || 0)) + " more";   // SCREEN1.more
const WF_TIMEOUT_MS = 15000, WF_REFRESH_MS = 30000, WF_PENDING_MAX = 200, WF_OPEN_MAX = 2000, SEL_MAX = 20;
const AGENT_CAUSE = {failed: "failed", killed: "was stopped", "killed(cost)": "stopped at the cost limit",
  "timed_out(idle)": "stopped: no progress", "timed_out(wall)": "ran out of time"};
const RED = new Set(["failed", "killed", "killed(cost)"]), AMBER = new Set(["timed_out(idle)", "timed_out(wall)"]);
const ROLE_NAME = {worker: "Worker", xval: "Second opinion", scout: "Scout", reviewer: "Reviewer", coordinator: "Coordinator"};
const AGENT_NAME = {pi: "pi", claude: "Claude Code", codex: "Codex"};
const W = {doc: null, busy: false, err: "", ctl: null, timer: 0, refreshT: 0, again: 0, idx: new Map(),
  pending: new Map(), pendT: 0, open: new Map(), sel: new Set(), lines: new Map(), loadedAt: 0};

const str = (v, n) => typeof v === "string" ? v.slice(0, n || 200) : "";
const arr = (v, n) => Array.isArray(v) ? v.slice(0, n) : [];
function ringOf(st){ return RED.has(st) ? "ring-red" : AMBER.has(st) ? "ring-amber" : st === "running" ? "ring-run" : ""; }
function worstOf(nodes, d = 1){
  let w = "";
  if (d > WF_DEPTH) return w;
  for (const n of nodes){
    if (RED.has(n.state)) return "ring-red";
    if (AMBER.has(n.state)) w = "ring-amber";
    const k = worstOf(arr(n.agents, 50), d + 1); if (k === "ring-red") return k; if (k) w = k;
  }
  return w;
}
// the ring and the cause text take one colour from the cause: amber = stalled or out of time, red = failed or stopped
function causeRing(cause, nodes){
  const c = String(cause || "");
  if (/no progress|ran out of time/.test(c)) return "ring-amber";
  if (c) return "ring-red";
  return worstOf(nodes || []);
}
function agentsOfTask(t){ return arr(t.agents, 50); }
// the contract has depth <= 2; every walk stops at WF_DEPTH, so a deep or cyclic document cannot blow the stack
const WF_DEPTH = 3, STATUS_MAX = 240;
function wfIndex(){
  const idx = new Map();
  const walk = (list, path, d) => { if (d > WF_DEPTH) return; list.forEach((a, i) => { if (a && a.id){
    idx.set("agent|" + a.id, {list, i}); walk(arr(a.agents, 50), path, d + 1); } }); };
  for (const w of arr(W.doc && W.doc.workflows, 300)) for (const s of arr(w.sessions, 200)) {
    const ts = arr(s.tasks, 200);
    ts.forEach((t, i) => { if (t && t.id){ idx.set("task|" + t.id, {list: s.tasks, i}); walk(arr(t.agents, 50), t.id, 1); } });
  }
  W.idx = idx;
}
/* a slow /api/workflows never freezes the page: the old view stays, the call has a deadline and an abort */
async function loadWorkflows(force){
  if (W.busy && !force) return;
  if (W.ctl) W.ctl.abort();
  const ctl = W.ctl = new AbortController(), win = S.wfWin;
  const dead = setTimeout(() => ctl.abort(), WF_TIMEOUT_MS);
  W.busy = true;
  const slow = setTimeout(() => { if (W.ctl === ctl) renderWorkflows(); }, 1500);
  clearTimeout(W.refreshT);
  try {
    const r = await api("/api/workflows?window=" + encodeURIComponent(win), {signal: ctl.signal});
    if (W.ctl !== ctl) return;
    W.doc = r && typeof r === "object" ? r : {workflows: []}; W.err = ""; W.loadedAt = Date.now();
    wfIndex();
  } catch (e) {
    if (W.ctl !== ctl) return;
    W.err = ctl.signal.aborted ? "Workflows did not answer in 15 s." : "Workflows not loaded: " + e.message;
  } finally {
    clearTimeout(dead); clearTimeout(slow);
    if (W.ctl === ctl){ W.ctl = null; W.busy = false;
      W.refreshT = setTimeout(() => { if (!document.hidden) loadWorkflows(); }, WF_REFRESH_MS);
      renderWorkflows(); }
  }
}
function setWindow(win){
  S.wfWin = win === "7d" ? "7d" : "24h";
  W.doc = null; W.idx = new Map(); W.pending.clear(); W.sel.clear();
  loadWorkflows(true);
}
/* SSE "workflow" events: one changed task or agent node each. A burst is bounded: at most WF_PENDING_MAX
   nodes wait (one per node; a newer event replaces the older), one timer paints them; more = one full reload. */
function onWorkflowEvent(ev){
  if (!ev || typeof ev !== "object" || !ev.node || typeof ev.node !== "object") return;
  if (S.wfWin !== "24h") return;                       // the stream follows the 24 h document
  const kind = ev.kind === "task" ? "task" : ev.kind === "agent" ? "agent" : null;
  const id = str(ev.node.id, 160);
  if (!kind || !id) return;
  const key = kind + "|" + id;
  if (!W.pending.has(key) && W.pending.size >= WF_PENDING_MAX){ W.pending.clear(); reloadSoon(); return; }
  W.pending.set(key, ev.node);
  wfRenderSoon();
}
function wfRenderSoon(){
  if (W.pendT) return;
  W.pendT = setTimeout(() => {
    W.pendT = 0;
    let miss = false;
    for (const [key, node] of W.pending){
      const at = W.idx.get(key);
      if (at && at.list[at.i] && at.list[at.i].id === node.id) at.list[at.i] = node; else miss = true;
    }
    W.pending.clear();
    wfIndex();
    renderWorkflows();
    if (miss) reloadSoon();
  }, 250);
}
function reloadSoon(){
  if (W.again) return;
  W.again = setTimeout(() => { W.again = 0; loadWorkflows(); }, 3000);
}
addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - W.loadedAt > WF_REFRESH_MS) loadWorkflows();
  if (document.hidden) stopLines();
});
addEventListener("pagehide", () => { if (W.ctl) W.ctl.abort(); clearTimeout(W.refreshT); stopLines(); });

/* fold: only running work is open at start; a click keeps the choice (bounded map) */
function isOpen(key, running){
  if (W.open.has(key)) return W.open.get(key);
  return running === true;
}
function toggle(key, running){
  const v = !isOpen(key, running);
  W.open.delete(key); W.open.set(key, v);
  if (W.open.size > WF_OPEN_MAX) W.open.delete(W.open.keys().next().value);
  renderWorkflows();
}
function foldBtn(key, running, kids, extra){
  const open = isOpen(key, running);
  return h("button", {type: "button", class: "fold" + (extra ? " " + extra : ""), "aria-expanded": String(open), "data-k": "f" + key,
    onclick: () => toggle(key, running)}, h("span", {class: "chev", "aria-hidden": "true"}), ...kids);
}
const hueOf = k => "hue-" + (AGENT_NAME[k] ? k : "other");
const isRun = st => st === "running" || st === "queued";
function treeRuns(nodes, d = 1){ return d <= WF_DEPTH && nodes.some(n => isRun(n.state) || treeRuns(arr(n.agents, 50), d + 1)); }

/* the live decision line: the lowest station of a running sub-agent (Task, Model, Safety, Cache, Send, Answer) */
function liveLine(a){
  const dec = normDec(a.decisions_last);
  const ol = h("ol", {class: "dline small", "aria-label": "Decisions of its newest request"});
  const items = STATIONS.map(([k, name], i) => {
    const d = dec[i];
    return h("li", {class: d.state, "data-step": k, "aria-label": name + ": " + d.verdict},
      h("span", {class: "stop", "aria-hidden": "true"}),
      h("span", {class: "dn"}, k === "model" ? modelIcon(d.verdict) : null, name),
      h("span", {class: "dv", text: d.verdict}));
  });
  ol.append(...items);
  const train = REDUCE ? null : h("span", {class: "train", "aria-hidden": "true", hidden: true});
  if (train) ol.append(train);
  const sig = JSON.stringify(dec);
  const old = W.lines.get(a.id);
  W.lines.set(a.id, {ol, items, train, dec, sig, at: old && old.sig === sig ? old.at : (old ? 0 : STATIONS.length), t: 0});
  return h("div", {class: "live"}, ol);
}
/* a new verdict set runs the train station to station (STATION_MS each); no motion = the verdicts at once */
function startLines(){
  for (const L of W.lines.values()){
    if (REDUCE || document.hidden) L.at = STATIONS.length;
    paintLine(L);
    if (L.at < STATIONS.length){
      const step = () => { L.at++; paintLine(L); if (L.at < STATIONS.length && L.ol.isConnected) L.t = setTimeout(step, STATION_MS); else L.t = 0; };
      L.t = setTimeout(step, STATION_MS);
    }
  }
}
function paintLine(L){
  L.items.forEach((li, i) => {
    const d = L.dec[i], passed = i <= L.at;
    li.className = (passed ? d.state : "wait") + (L.at < STATIONS.length && i === L.at ? " here" : "");
  });

function onSnapshot(s){
  if (!s || typeof s !== "object") return;
  S.snap = s; S.lastSnap = Date.now(); S.stale = "";
  renderStatus();
  if (S.panel === "changes" || S.panel === "agent" || S.panel === "provider") renderPanelSoon();
}
function onBlock(block){
  let ev = "message"; const data = [];
  for (const ln of block.split("\n")){
    if (!ln || ln.startsWith(":")) continue;
    const i = ln.indexOf(":"), k = i < 0 ? ln : ln.slice(0, i), v = i < 0 ? "" : ln.slice(i + 1).replace(/^ /, "");
    if (k === "event") ev = v; else if (k === "data") data.push(v);
  }
  if (!data.length) return;
  let obj; try { obj = JSON.parse(data.join("\n")); } catch (e) { return; }
  if (ev === "snapshot") onSnapshot(obj);
  else if (ev === "request") addRequests([obj], true);
  else if (ev === "workflow") onWorkflowEvent(obj);
}
async function stream(){
  let back = 1000;
  for (;;){
    try {
      const r = await fetch("/api/stream", {headers: {"X-Studio-Token": TOKEN, "Accept": "text/event-stream"}, cache: "no-store"});
      if (r.status === 404){ S.pollMode = true; return poll(); }
      if (r.status === 429){ await sleep(10000); continue; }
      if (!r.ok || !r.body) throw new Error("HTTP " + r.status);
      back = 1000;
      const rd = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;){
        const {value, done} = await rd.read();
        if (done) break;
        buf = (buf + dec.decode(value, {stream: true})).replace(/\r\n?/g, "\n");
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0){ onBlock(buf.slice(0, i)); buf = buf.slice(i + 2); }
        if (buf.length > 1 << 20) buf = "";
      }
    } catch (e) { back = Math.min(30000, back * 2); }
    await sleep(back);
  }
}

      const lines = Object.values(by).map(o => ({agent: o.agent, provider: o.provider, rpm: o.n / 15, err_pct: 100 * o.bad / o.n, live: true}));
      const last = S.recent[0];
      onSnapshot({status: {level: "ok", sentence: last ? `Last request ${ago(last.ts)} ago.` : "No requests yet."}, lines, proxy: null});
    } catch (e) {
      S.stale = "No live data yet."; renderStatus();
    }
    await sleep(5000);
  }
}

/* Tokens: "of X input tokens, Y came from cache" as a split bar per agent */
function tokSplit(t, max, color, isBig){

  const c = h("div", {class: "c"}); c.style.width = (inp ? 100 * cache / inp : 0) + "%"; c.style.background = color;
  const n = h("div", {class: "n"}); n.style.width = (inp ? 100 * fresh / inp : 100) + "%"; n.style.borderColor = color;

/* the live decision line: a train moves station to station (STATION_MS each); a warn or error station

function sticky(i, skip){
  let worst = null;

    if (r.id === skip) continue;
    const d = r.dec[i];
    if (d.state === "error" && (!worst || worst.state !== "error")) worst = d;

  STATIONS.forEach(([, name], i) => {
    const passed = i <= at, li = F.items[i], d = r ? r.dec[i] : {verdict: "—", state: "none"};
    const s = sticky(i, passed || !r ? null : r.id);
    const st = passed ? worse(d.state, s && s.state) : (s ? s.state : "wait");
    li.className = st + (S.flowRun && i === at ? " here" : "");
    li.querySelector(".dv").textContent = passed ? d.verdict : "";

function bytes(n){ n = +n || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1) + " GB"; if (n >= 1e6) return Math.round(n / 1e6) + " MB";
  if (n >= 1e3) return Math.round(n / 1e3) + " KB"; return n + " B"; }
function dur(s){ s = Math.max(0, Math.round(+s || 0));
  if (s < 90) return s + " s"; if (s < 5400) return Math.round(s / 60) + " min";
  if (s < 172800) return Math.round(s / 3600) + " h"; return Math.round(s / 86400) + " days"; }
function lat(L){ // the 15 min window; the 1 hour window when 15 min has too few answers
  const a = L && L["15m"], b = L && L["1h"], pick = k => (a && a[k] && a[k].n >= 3) ? [a[k], "15 min"] : (b && b[k] && b[k].n ? [b[k], "1 hour"] : [null, ""]);
  return {fw: pick("first_word"), wa: pick("whole_answer")};
}
function pipeRead(p){
  const r = p.reads || {};
  if (r.kind === "cursor") return r.rows ? `kept ${big(r.rows)} requests from ${r.files} old ${r.files === 1 ? "file" : "files"}` : "nothing archived yet";
  if (r.kind === "files") return r.bytes ? `reads ${bytes(r.bytes)} each run` : "nothing to read";
  return r.rows !== null && r.rows !== undefined ? `read ${big(r.rows)} requests (last ${dur(r.window_s)})` : `reads the last ${dur(r.window_s)}`;
}
function pipeStatus(p){
  if (p.error) return "Cannot read it.";
  if (p.state === "not installed") return "Not installed.";
  if (p.state === "never ran") return "Never ran.";
  const ran = p.last_run_ts ? "last ran " + ago(p.last_run_ts) + " ago" : "";
  if (p.state === "failed") return ran + " · it failed";
  const r = p.reads || {};
  if (r.kind === "cursor") return ran + " · " + (r.files_waiting ? `${r.files_waiting} old ${r.files_waiting === 1 ? "file waits" : "files wait"}` : "all old files read");
  // "read to now" only when it is near; "N h behind" only when a scheduled job is late; else where it read to
  const b = p.behind_s;
  const behind = b === null || b === undefined ? "" : b < 120 ? "read to now" : p.late ? dur(b) + " behind" : "read to " + dur(b) + " ago";
  return [ran, behind].filter(Boolean).join(" · ");
}
VIEWS.records = () => {
  if (!S.recs){ api("/api/records").then(r => { S.recs = r || {}; }, e => { S.recs = {error: e.message}; })
    .then(() => { if (S.panel === "records") renderPanel(); }); return {title: "Records", sub: "Loading…"}; }
  const R = S.recs;
  if (R.error) return {title: "Records", sub: "Not available: " + R.error,
    body: [h("button", {class: "btn", type: "button", text: "Try again", onclick: () => { S.recs = null; renderPanel(); }})]};
  const T = R.throughput || {}, t1 = T["1m"] || {}, t15 = T["15m"] || {};
  const body = [];
  // 1. speed (small picture first)
  body.push(h("p", {class: "rate", title: "In = answers from providers. Out = requests to providers. Wire bytes, both proxies."},
    "in ", h("b", {text: rate(t1.down_bps)}), " · out ", h("b", {text: rate(t1.up_bps)})));
  body.push(h("p", {class: "rate2", text: `Last minute. Last 15 min: in ${rate(t15.down_bps)} · out ${rate(t15.up_bps)}.`}));
  // 2. wait
  const W = lat(R.latency), fw = W.fw[0], wa = W.wa[0];
  const tip = (x, w) => x ? `Median ${secs(x.p50)}, slowest 5 %: ${secs(x.p95)} (${x.n} answers, last ${w}).` : null;
  body.push(h("p", {class: "rate"},
    h("span", {title: tip(fw, W.fw[1])}, "first word ", h("b", {text: fw ? secs(fw.p50) : "—"})), " · ",
    h("span", {title: tip(wa, W.wa[1])}, "whole answer ", h("b", {text: wa ? secs(wa.p50) : "—"}))));
  body.push(h("p", {class: "rate2", text: wa ? "Typical wait. Point at a number for the slowest answers." :
    "The whole-answer time is recorded from the next proxy restart on."}));
  // 3. disk
  const D = R.disk || {};
  if (D.error) body.push(h("p", {class: "muted", text: "Disk: not available."}));
  else {
    const act = +D.active_bytes || 0, arc = +D.archived_bytes || 0, tot = Math.max(1, act + arc);
    const bar = h("div", {class: "dbar", role: "img", "aria-label": `Request log on disk: active ${bytes(act)}, archived ${bytes(arc)}`});
    const a = h("div", {class: "a"}); a.style.width = (100 * act / tot) + "%";
    const z = h("div", {class: "z"}); z.style.width = (100 * arc / tot) + "%";
    bar.append(a, z);
    body.push(h("h3", {text: "Request log on disk"}), bar,
      h("div", {class: "dkey"}, h("span", {}, h("i", {class: "a", "aria-hidden": "true"}), "active " + bytes(act)),
        h("span", {title: `apex keeps the newest ${D.keep_files} old files.`}, h("i", {class: "z", "aria-hidden": "true"}),
          `archived ${bytes(arc)} (${D.archived_files} old ${D.archived_files === 1 ? "file" : "files"})`)));
    const other = (Array.isArray(D.other) ? D.other : []).filter(o => o.present);
    if (other.length){
      const sum = other.reduce((s, o) => s + (+o.bytes || 0), 0);
      body.push(h("details", {}, h("summary", {text: `Other records: ${bytes(sum)}`}),
        facts(other.map(o => h("span", {}, h("b", {text: String(o.label)}), " " + bytes(o.bytes))))));
    }
  }
  // 4. the pipelines: a short branch from Records, one station per job
  const P = Array.isArray(R.pipelines) ? R.pipelines : [];
  body.push(h("h3", {text: "Jobs that read the records"}));
  const ul = h("ul", {class: "branch"}, h("li", {class: "root"}, h("span", {class: "stn"}, procIcon("records")),
    h("div", {class: "pn", text: "Records"})));
  for (const p of P){
    const cls = p.error || p.state === "failed" ? "bad" : p.state === "late" ? "late" : (p.state === "ok" ? "" : "off");
    ul.append(h("li", {class: cls, title: `Makes ${p.makes}. Runs ${p.schedule ? p.schedule.text : "?"}. Reads ${p.source}.`},
      h("span", {class: "stn"}, procIcon(String(p.id || ""), cls === "bad" ? "ring-red" : cls === "late" ? "ring-amber" : "")),
      h("div", {class: "pn", text: String(p.name || p.id)}),
      h("div", {class: "ps", text: pipeStatus(p)}), h("div", {class: "pm", text: pipeRead(p)})));
  }
  if (!P.length) ul.append(h("li", {class: "off"}, h("span", {class: "stop", "aria-hidden": "true"}), h("div", {class: "ps", text: "No jobs found."})));
  body.push(ul);
  if (R.complete === false) body.push(h("p", {class: "muted small", text: "Very busy: only the newest part of the log was read."}));
  body.push(h("div", {class: "row"}, h("button", {class: "btn", type: "button", text: "Refresh", onclick: () => { S.recs = null; renderPanel(); }}),
    h("button", {class: "btn", type: "button", text: "Recent requests", onclick: () => openPanel("recent")}),
    h("button", {class: "btn", type: "button", text: "apex decisions", onclick: () => openPanel("apex")})));
  return {title: "Records", sub: "Speed, wait and disk of the request log. No prompt text, no keys.", body};
};

/* ---------- open a node (#node=<id>) ---------- */
function openFlowId(id){
  const a = AGENTS.find(x => x.node === id); if (a) return openPanel("agent", a.k);
  const p = PROVIDERS.find(x => x.node === id); if (p) return openPanel("provider", p.k);
  if (/^sink\./.test(id)) return openPanel("records");
  return openPanel("apex", id);
}
async function loadFlow(){
  try { S.flow = await api("/api/flow?proxy=" + S.proxy); } catch (e) { toast("Steps not loaded: " + e.message, true); }
}

/* ---------- controls ---------- */
qa("nav button").forEach(b => b.addEventListener("click", () => {
  const k = b.getAttribute("data-panel");
  if (S.panel === k) closePanel(); else { if (k === "changes") S.review = null, S.msg = null; if (k === "experiments") S.exps = null;
    if (k === "tokens") S.tok = null; if (k === "records") S.recs = null; openPanel(k); }
}));
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape"){
    if (S.selReq){ S.selReq = null; renderPanel(); return; }
    if (S.panel){ ev.preventDefault(); closePanel(); }
  }
});
function applyHash(){
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.has("review")) { S.review = null; return openPanel("changes"); }
  for (const k of ["recent", "experiments", "tokens", "records", "apex"]) if (q.has(k) && !q.get(k)) return openPanel(k);
  if (q.get("node")) return openFlowId(q.get("node"));
  // #branches (v1) has no view in v2: ignored
}
addEventListener("hashchange", applyHash);

(async function init(){
  renderStatus(); renderWorkflows();
  loadWorkflows();
  loadDraft();
  const flowP = loadFlow();
  try { const r = await api("/api/recent?n=50"); addRequests((r && r.requests) || [], false); }
  catch (e) { /* the stream or the poll fills the list */ }
  stream();
  await flowP;
  if (location.hash.length > 1){
    await sleep(300);   // let the first snapshot draw the lines
    applyHash();
    const q = new URLSearchParams(location.hash.slice(1));
    if (q.has("pick") && S.panel === "recent"){ const r = S.recent[+q.get("pick") || 0]; if (r) selectReq(r); }
  }
})();
</script>
