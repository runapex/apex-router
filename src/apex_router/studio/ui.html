<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>apex flow studio</title>
<style nonce="__NONCE__">
:root{
  --bg:#0E0E0D;--panel:#181816;--card:#1F1F1C;--card2:#272724;--line:#34342F;
  --fg:#F2F0E8;--fg2:#C9C6BB;--muted:#9C9A91;
  --accent:#E0855F;--good:#93B866;--warn:#EE9A84;--bad:#F07462;--net:#78A6D6;--gpu:#B49AD3;
  --lit:#F0A060;--shadow:0 6px 24px rgba(0,0,0,.45);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){:root{
  --bg:#F5F4EF;--panel:#FFFFFF;--card:#FFFFFF;--card2:#F0EEE7;--line:#D8D5CB;
  --fg:#141413;--fg2:#3D3C38;--muted:#5E5D59;
  --accent:#A9481F;--good:#3F6B1F;--warn:#A4432F;--bad:#B5372B;--net:#2F5F92;--gpu:#6A4C93;
  --lit:#B4561F;--shadow:0 6px 24px rgba(0,0,0,.12);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 var(--sans)}
button,input,select{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--lit);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
header{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.brand{font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand b{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;cursor:pointer;color:var(--fg2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--fg);font-weight:600}
.lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.test{flex:1;display:flex;gap:6px;min-width:240px;max-width:620px}
.test input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.test input::placeholder{color:var(--muted)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#141413;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.draft{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap}
.draft.has{border-color:var(--accent);color:var(--accent);font-weight:600}
.spacer{flex:0 0 auto}

/* result bar */
#result{position:fixed;top:56px;left:0;right:0;min-height:0;z-index:15;background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 16px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
#result.show{display:flex}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line);font-size:12px;white-space:nowrap}
.chip.k{border-color:var(--lit);color:var(--lit)}
.arrow{color:var(--muted)}
.reason{color:var(--fg2)}

/* banner */
#banner{position:fixed;left:16px;bottom:14px;z-index:16;max-width:640px;display:none;padding:8px 12px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);color:var(--fg2);box-shadow:var(--shadow)}
#banner.show{display:block}
#banner.err{border-color:var(--bad);color:var(--fg)}

/* canvas */
main{position:absolute;top:56px;left:0;right:0;bottom:0;overflow:auto}
main.withres{top:var(--restop,104px)}
#canvas{position:relative;margin:0 auto}
#edges{position:absolute;left:0;top:0;overflow:visible}
.lane-h{position:absolute;top:16px;font-size:12px;font-weight:650;letter-spacing:.7px;text-transform:uppercase;color:var(--accent)}
.lane-bg{position:absolute;border-radius:12px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.node{position:absolute;display:grid;grid-template-columns:24px 1fr auto;grid-template-rows:auto 1fr;column-gap:8px;
  padding:9px 10px 8px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;
  text-align:left;box-shadow:0 1px 0 rgba(0,0,0,.25);transition:opacity .2s,border-color .2s}
.node:hover{border-color:var(--muted)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.node .ic{grid-row:1/3;font-size:16px;line-height:24px;text-align:center;width:24px;height:24px;border-radius:6px;background:var(--card2);color:var(--fg2)}
.node .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;min-width:0}
.node .nm span.t{overflow:hidden;text-overflow:ellipsis}
.node .val{grid-column:2/4;align-self:end;display:flex;align-items:baseline;gap:6px;min-width:0}
.node .val .n{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.3px}
.node .val .u{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .side{grid-column:3;grid-row:1;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--muted)}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.error{background:var(--bad)}
.dot.idle{background:transparent;border:2px solid var(--good)}
.dot.nodata{background:transparent;border:2px solid var(--muted)}
.dot.locked{background:var(--muted)}
.lock{font-size:11px;color:var(--muted)}
.node.lane-upstreams .ic{color:var(--net)} .node#n-up\.ollama .ic{color:var(--gpu)}
.node.lane-sinks .ic{color:var(--accent)}
.node.dim{opacity:.32}
.node.lit{border-color:var(--lit);box-shadow:0 0 0 2px color-mix(in srgb,var(--lit) 55%,transparent)}
.sw{position:relative;width:30px;height:18px;border-radius:9px;border:1px solid var(--line);background:var(--card2);cursor:pointer;padding:0;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-checked="true"]{background:color-mix(in srgb,var(--good) 35%,var(--card2));border-color:var(--good)}
.sw[aria-checked="true"]::after{left:14px;background:var(--good)}
.sw.drafted{box-shadow:0 0 0 2px var(--accent)}

/* edges */
.e{fill:none;stroke-linecap:round}
.e.main{stroke:color-mix(in srgb,var(--net) 70%,var(--line))}
.e.error{stroke:var(--bad);stroke-dasharray:5 5}
.e.fallback{stroke:var(--warn);stroke-dasharray:4 5;opacity:.85}
.e.offload{stroke:var(--gpu);stroke-dasharray:6 5}
.e.skip{stroke:var(--muted);stroke-dasharray:2 5;opacity:.5}
.e.zero{opacity:.45}
.flow{fill:none;stroke:var(--fg);stroke-opacity:.55;stroke-width:1.4;stroke-dasharray:3 13;animation:dash 1.1s linear infinite}
.flow.err{stroke:var(--bad);stroke-opacity:.9}
@keyframes dash{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion: reduce){.flow{animation:none;display:none}.node{transition:none}}
.e.lit{stroke:var(--lit);opacity:1}
.e.dim{opacity:.12}
.flow.dim{display:none}
.el{font:11px var(--sans);fill:var(--fg2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
g.hide{display:none}
.btn.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.el.lit{fill:var(--lit)}

/* inspector */
#insp{position:fixed;top:56px;right:0;bottom:0;width:420px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);
  box-shadow:var(--shadow);z-index:18;overflow:auto;transform:translateX(105%);transition:transform .18s;padding:0 0 24px}
#insp.open{transform:none}
@media (prefers-reduced-motion: reduce){#insp{transition:none}}
.ih{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:1}
.ih h2{margin:0;font-size:16px;flex:1;display:flex;align-items:center;gap:8px}
.x{background:transparent;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--fg2)}
.sec{padding:10px 16px 4px}
.sec h3{margin:6px 0 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--accent)}
.does{color:var(--fg2);margin:10px 16px 2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--mono);word-break:break-all}
.sname{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.shelp{color:var(--muted);font-size:11.5px;margin-top:2px}
.slist{display:flex;flex-direction:column;gap:8px}
.scard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.scard.drafted{border-color:var(--accent)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scard .sname{font:600 12px var(--mono);overflow-wrap:anywhere}
.scard .shelp{color:var(--fg2);font-size:12px;margin:3px 0 6px}
.svals{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12px;margin-bottom:6px}
.svals .k{color:var(--muted)} .svals .v{font-family:var(--mono);overflow-wrap:anywhere}
.scard .edit{display:flex;gap:6px} .scard .edit input,.scard .edit select{flex:1;min-width:0}
.rs{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.rs-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rs .num{width:70px} .rs-state{margin-top:8px;font-size:12.5px;color:var(--fg2)}
.rs-state.ok{color:var(--good)} .rs-state.err{color:var(--bad)} .small{font-size:11.5px;margin:6px 0 0}
details.manual{margin-top:8px} details.manual summary{cursor:pointer;color:var(--fg2);font-size:12px}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:650;border:1px solid;white-space:nowrap}
.badge.live{color:var(--good);border-color:var(--good)}
.badge.restart{color:var(--warn);border-color:var(--warn)}
.badge.locked{color:var(--muted);border-color:var(--muted)}
.badge.draft{color:var(--accent);border-color:var(--accent)}
.edit{display:flex;gap:6px;margin-top:6px}
.edit input,.edit select{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono)}
.big{font-family:var(--mono);font-size:26px;font-weight:600}
.spark{display:block;margin:6px 0 4px}
.spark .a{fill:color-mix(in srgb,var(--net) 22%,transparent)}
.spark .l{fill:none;stroke:var(--net);stroke-width:1.5}
.spark.err .a{fill:color-mix(in srgb,var(--bad) 22%,transparent)} .spark.err .l{stroke:var(--bad)}
ul.plain{margin:0;padding:0 0 0 16px}
ul.plain li{margin:2px 0}
code,.code{font-family:var(--mono);font-size:11.5px;color:var(--fg2);word-break:break-all}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-style:italic}

/* review dialog */
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:0;width:min(820px,94vw);
  max-height:88vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dh h2{margin:0;font-size:16px;flex:1}
.db{padding:6px 18px 12px;overflow:auto;max-height:calc(88vh - 120px)}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.tgt{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.tgt .th{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--card);flex-wrap:wrap}
.tgt .th .f{font-family:var(--mono);font-size:12px;flex:1;word-break:break-all}
.tgt .why{padding:6px 12px;color:var(--fg2);font-size:12px}
.tgt ul{margin:4px 0;padding:0 12px 0 28px;font-size:12px}
pre.diff{margin:0;padding:8px 12px;font:11.5px/1.45 var(--mono);background:var(--bg);overflow:auto;border-top:1px solid var(--line);white-space:pre}
pre.diff .p{color:var(--good)} pre.diff .m{color:var(--bad)} pre.diff .h{color:var(--muted)}
.cmds{margin:0;padding:8px 12px;font:11.5px/1.5 var(--mono);background:var(--bg);border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-all}
.rm{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:0 4px}
.msg{padding:8px 12px;border-radius:8px;margin:8px 0;border:1px solid var(--line);background:var(--card)}
.msg.ok{border-color:var(--good)} .msg.err{border-color:var(--bad)}
</style>
</head>
<body>
<header>
  <div class="brand">apex <b>flow studio</b></div>
  <div class="lbl" id="lbl-proxy">Proxy</div>
  <div class="seg" role="group" aria-labelledby="lbl-proxy" id="proxy-seg">
    <button type="button" data-proxy="main" aria-pressed="true">:8788 main</button>
    <button type="button" data-proxy="local" aria-pressed="false">:8789 local</button>
  </div>
  <div class="lbl" id="lbl-win">Window</div>
  <div class="seg" role="group" aria-labelledby="lbl-win" id="win-seg">
    <button type="button" data-win="15m" aria-pressed="true">15m</button>
    <button type="button" data-win="1h" aria-pressed="false">1h</button>
    <button type="button" data-win="24h" aria-pressed="false">24h</button>
  </div>
  <form class="test" id="test-form" role="search" aria-label="Test a prompt">
    <label class="sr" for="test-in">Test a prompt (dry run, no model call)</label>
    <input id="test-in" autocomplete="off" spellcheck="false" maxlength="20000"
           placeholder="Test a prompt: >>auto fix the failing test   ( / )">
    <button class="btn" type="submit">Test</button>
  </form>
  <button class="btn chip" type="button" id="br-btn" aria-pressed="false" title="Show fallback, retry, offload and side branches (b)">Branches</button>
  <span class="draft" id="draft-badge" aria-live="polite">No draft</span>
  <button class="btn primary" type="button" id="review-btn">Review</button>
</header>
<div id="result" role="status" aria-live="polite"></div>
<main id="main" aria-label="Request flow canvas">
  <div id="canvas"><svg id="edges" aria-hidden="true"></svg></div>
</main>
<aside id="insp" role="dialog" aria-modal="false" aria-labelledby="insp-title" aria-hidden="true"></aside>
<div id="banner" role="status" aria-live="polite"></div>
<dialog id="review" aria-labelledby="rv-title">
  <div class="dh"><h2 id="rv-title">Review draft</h2><button class="x" type="button" id="rv-close" aria-label="Close review">✕</button></div>
  <div class="db" id="rv-body"></div>
  <div class="df">
    <button class="btn" type="button" id="rv-discard">Discard draft</button>
    <button class="btn" type="button" id="rv-rollback">Rollback last apply</button>
    <button class="btn primary" type="button" id="rv-apply">Apply</button>
  </div>
</dialog>
<script nonce="__NONCE__">
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const S = {flow:null, live:null, draft:null, review:null, win:"15m", proxy:"main", test:null, sel:null, focus:null, branches:false};
// Branch edges (fallback, retry, offload, side sinks) are hidden until "Branches" is on, a touching node is
// selected, or a test lights them: the main path stays readable (no spaghetti).
const isBranch = e => e.kind !== "main" || /xval|escalation/.test(e.label || "");
const L = {x0:24, laneW:212, gap:72, rowTop:136, rowH:80, rowGap:22, topBand:46};
const laneIdx = id => S.flow.lanes.findIndex(l => l.id === id);
const lx = i => L.x0 + i * (L.laneW + L.gap);
const ry = r => L.rowTop + r * (L.rowH + L.rowGap);

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})){
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()){ if (c === null || c === undefined || c === false) continue;
    e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs){ const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) e.setAttribute(k, v); return e; }

async function api(path, opts){
  opts = opts || {};
  const init = {method: opts.method || "GET", headers: {"X-Studio-Token": TOKEN}, cache: "no-store"};
  if (opts.body !== undefined){ init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const r = await fetch(path, init);
  let j = null; try { j = await r.json(); } catch (e) { j = null; }
  if (!r.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
  return j;
}
function banner(text, err){ const b = document.getElementById("banner");
  b.textContent = text || ""; b.className = text ? ("show" + (err ? " err" : "")) : ""; }

/* ---------- canvas ---------- */
function nodeById(id){ return S.flow.nodes.find(n => n.id === id); }
function rect(n){ const i = laneIdx(n.lane); return {x: lx(i), y: ry(n.row), w: L.laneW, h: L.rowH, lane: i}; }
function maxRow(laneI){ return Math.max(-1, ...S.flow.nodes.filter(n => laneIdx(n.lane) === laneI).map(n => n.row)); }

function buildCanvas(){
  const c = document.getElementById("canvas");
  c.querySelectorAll(".node,.lane-h,.lane-bg").forEach(e => e.remove());
  const lanes = S.flow.lanes.length;
  const W = lx(lanes - 1) + L.laneW + L.x0;
  const rows = Math.max(...S.flow.nodes.map(n => n.row)) + 1;
  const H = ry(rows) + 70;
  c.style.width = W + "px"; c.style.height = H + "px";
  const svg = document.getElementById("edges"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  S.flow.lanes.forEach((l, i) => {
    const bg = h("div", {class: "lane-bg", "aria-hidden": "true"});
    bg.style.left = (lx(i) - 10) + "px"; bg.style.top = "8px"; bg.style.width = (L.laneW + 20) + "px";
    bg.style.height = (ry(maxRow(i) + 1) - 8) + "px";
    c.append(bg);
    const t = h("div", {class: "lane-h", text: l.name, "aria-hidden": "true"});
    t.style.left = lx(i) + "px"; c.append(t);
  });
  for (const n of S.flow.nodes){
    const r = rect(n);
    const card = h("div", {class: "node lane-" + n.lane, id: "n-" + n.id, role: "button", tabindex: "-1",
      "data-id": n.id, onclick: () => openInspector(n.id), onkeydown: onNodeKey, onfocus: () => { S.focus = n.id; }});
    card.style.left = r.x + "px"; card.style.top = r.y + "px"; card.style.width = r.w + "px"; card.style.height = r.h + "px";
    const side = h("div", {class: "side"});
    if (n.locked) side.append(h("span", {class: "lock", title: "Locked: read-only", "aria-hidden": "true", text: "🔒"}));
    if (n.switch){
      const sw = h("button", {class: "sw", type: "button", role: "switch", "aria-checked": "false",
        "aria-label": n.switch + " on/off (adds to draft)", "data-setting": n.switch,
        onclick: ev => { ev.stopPropagation(); toggleSwitch(n.switch); }, onkeydown: ev => ev.stopPropagation()});
      side.append(sw);
    }
    side.append(h("span", {class: "dot nodata", "aria-hidden": "true"}));
    card.append(h("div", {class: "ic", "aria-hidden": "true", text: n.icon}),
      h("div", {class: "nm"}, h("span", {class: "t", text: n.name})), side,
      h("div", {class: "val"}, h("span", {class: "n", text: "—"}), h("span", {class: "u", text: n.unit || ""})));
    c.append(card);
  }
  const first = document.getElementById("n-" + (S.focus || S.flow.nodes[0].id));
  if (first) first.tabIndex = 0;
  drawEdges();
  paintLive(); paintSwitches(); paintTest();
}

function anchors(e){
  const a = rect(nodeById(e.from)), b = rect(nodeById(e.to));
  return {a, b};
}
function edgePath(e, slot){
  const {a, b} = anchors(e);
  if (e.from === e.to){                                   // self-loop (retry), left side
    const x = a.x, y = a.y + a.h / 2;
    return {d: `M${x} ${y - 14} C${x - 40} ${y - 30} ${x - 40} ${y + 30} ${x} ${y + 14}`, lx: x - 52, ly: y + 4, anchor: "end"};
  }
  if (a.lane === b.lane){                                 // same lane, vertical
    const down = b.y > a.y;
    if (e.kind === "main"){
      const x = a.x + a.w / 2, y1 = down ? a.y + a.h : a.y, y2 = down ? b.y : b.y + b.h;
      return {d: `M${x} ${y1} L${x} ${y2}`, lx: x + 6, ly: (y1 + y2) / 2 + 4};
    }
    const right = e.kind === "error";
    const bulge = e.kind === "skip" ? 46 : 26;
    const x1 = right ? a.x + a.w : a.x, x2 = right ? b.x + b.w : b.x;
    const y1 = a.y + a.h * 0.72, y2 = b.y + b.h * 0.28, dx = right ? bulge : -bulge;
    return {d: `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 + dx} ${y2} ${x2} ${y2}`,
      lx: right ? x1 + bulge * 0.8 + 4 : x1 - bulge * 0.8 - 4, ly: (y1 + y2) / 2 + 4, anchor: right ? "start" : "end"};
  }
  const fwd = b.lane > a.lane;
  const sx = fwd ? a.x + a.w : a.x, tx = fwd ? b.x : b.x + b.w;
  const sy = a.y + a.h / 2, ty = b.y + b.h / 2;
  const span = Math.abs(b.lane - a.lane);
  if (span === 1){
    const m = (tx - sx) / 2;
    return {d: `M${sx} ${sy} C${sx + m} ${sy} ${tx - m} ${ty} ${tx} ${ty}`, lx: (sx + tx) / 2, ly: (sy + ty) / 2 - 6, anchor: "middle"};
  }
  // lane-skipping edge: run in a channel above row 0 or below the skipped lanes
  let lo = Math.min(a.lane, b.lane) + 1, hi = Math.max(a.lane, b.lane) - 1, mr = -1;
  for (let i = lo; i <= hi; i++) mr = Math.max(mr, maxRow(i));
  const bottomY = Math.max(sy, ty, ry(mr + 1) - L.rowGap / 2 + 10 + slot * 8);
  const topY = L.rowTop - 16 - slot * 11;
  const useTop = (sy - topY) + (ty - topY) < (bottomY - sy) + (bottomY - ty);
  const cy = useTop ? topY : bottomY;
  const g = L.gap / 2;
  const x1 = sx + g, x2 = tx - g;
  const d = `M${sx} ${sy} C${sx + g * 0.9} ${sy} ${sx + g * 0.1} ${cy} ${x1} ${cy} L${x2} ${cy} ` +
            `C${tx - g * 0.1} ${cy} ${tx - g * 0.9} ${ty} ${tx} ${ty}`;
  // label at the start of its own run (not the middle, where vertical drops cross); slot 0 has the
  // other top slots above it, so its label goes under the line
  return {d, lx: Math.min(x1 + 8 + slot * 130, (x1 + x2) / 2), ly: useTop ? (slot === 0 ? cy + 13 : cy - 4) : cy + 15, anchor: "start"};
}

function edgeWidth(v){ return v ? 1.6 + Math.min(6, Math.log10(v + 1) * 1.8) : 1.4; }
function drawEdges(){
  const svg = document.getElementById("edges");

    const a = rect(nodeById(e.from)), b = rect(nodeById(e.to));
    const skips = a.lane !== b.lane && Math.abs(b.lane - a.lane) > 1;
    const p = edgePath(e, skips ? slot++ : 0);
    const g = sv("g", {"data-edge": e.id});
    const base = sv("path", {d: p.d, class: "e " + e.kind});
    const t = sv("title", {}); t.textContent = `${e.from} → ${e.to}${e.label ? " (" + e.label + ")" : ""}`;
    base.append(t); g.append(base);
    const fl = sv("path", {d: p.d, class: "flow" + (e.kind === "error" ? " err" : "")});

/* ---------- inspector ---------- */
function spark(series, err){
  const w = 360, hgt = 44; const v = series || [];
  const svg = sv("svg", {width: w, height: hgt, class: "spark" + (err ? " err" : ""), role: "img",
    "aria-label": "sparkline of the window, " + v.length + " buckets"});
  if (!v.length) return svg;
  const mx = Math.max(1, ...v); const step = w / Math.max(1, v.length - 1);
  const pts = v.map((y, i) => `${(i * step).toFixed(1)},${(hgt - 3 - (y / mx) * (hgt - 8)).toFixed(1)}`);
  svg.append(sv("polygon", {class: "a", points: `0,${hgt} ${pts.join(" ")} ${w},${hgt}`}), sv("polyline", {class: "l", points: pts.join(" ")}));
  return svg;
}

}

/* ---------- keyboard ---------- */

function onNodeKey(ev){
  const id = ev.currentTarget.getAttribute("data-id"); const n = nodeById(id); const li = laneIdx(n.lane);
  const inLane = i => S.flow.nodes.filter(x => laneIdx(x.lane) === i).sort((a, b) => a.row - b.row);
  let t = null;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp"){
    const l = inLane(li); const k = l.findIndex(x => x.id === id);
    t = l[k + (ev.key === "ArrowDown" ? 1 : -1)];
  } else if (ev.key === "ArrowRight" || ev.key === "ArrowLeft"){
    const ni = li + (ev.key === "ArrowRight" ? 1 : -1);

      t = l.reduce((best, x) => !best || Math.abs(x.row - n.row) < Math.abs(best.row - n.row) ? x : best, null); }

  const pre = h("pre", {class: "diff", tabindex: "0", "aria-label": "diff"});
  for (const ln of (text || "").split("\n")){ if (!ln) continue;
    const cls = ln.startsWith("+++") || ln.startsWith("---") || ln.startsWith("@@") ? "h" : ln.startsWith("+") ? "p" : ln.startsWith("-") ? "m" : "";
    pre.append(h("span", {class: cls, text: ln + "\n"})); }
  return pre;
}
function renderReview(extra){
  const rv = S.review || {targets: [], count: 0, errors: []};
  const body = document.getElementById("rv-body"); const kids = [];
  if (extra) kids.push(extra);
  kids.push(h("p", {class: "muted", text: rv.count ? `${rv.count} change(s): ${rv.live} live (Apply writes the file, with a backup), ${rv.restart} restart (applied with a proxy restart when it is idle).` :
    "The draft is empty. Use a switch on a card, or Add to draft in the inspector."}));
  for (const e of rv.errors || []) kids.push(h("div", {class: "msg err", text: `${e.key}: ${e.error}`}));
  for (const t of rv.targets){
    const box = h("div", {class: "tgt"});
    box.append(h("div", {class: "th"}, h("span", {class: "badge " + t.class, text: t.class === "live" ? "live: Apply writes" : "restart: when idle"}),
      h("span", {class: "f", text: t.file})));
    box.append(h("div", {class: "why", text: t.error ? "Cannot apply: " + t.error : t.why}));
    box.append(h("ul", {}, t.changes.map(c => h("li", {}, h("span", {class: "code", text: `${c.name} = ${c.value}`}),
      h("button", {class: "rm", type: "button", "aria-label": "Remove " + c.name + " from draft", text: "✕",
        onclick: async () => { await putDraft({unset: [c.key]}); renderReview(); }})))));
    if (t.diff) box.append(diffPre(t.diff));
    if (t.target && t.target.startsWith("plist:")) box.append(restartPanel(t.target.slice(6)));
    if (t.commands) box.append(h("details", {class: "manual"}, h("summary", {text: "Or run the commands yourself"}),
      h("pre", {class: "cmds", tabindex: "0", "aria-label": "commands to run yourself", text: t.commands.join("\n")})));
    kids.push(box);
  }
  const lb = rv.last_backup;
  kids.push(h("p", {class: "muted", text: lb ? `Last backup: ${lb.id} (${lb.files.join(", ")})` : "No backup yet: Rollback has nothing to restore."}));
  body.replaceChildren(...kids);
  const ap = document.getElementById("rv-apply");
  ap.textContent = rv.live ? `Apply ${rv.live} live change${rv.live === 1 ? "" : "s"}` + "" : "Apply live changes";
  ap.disabled = !rv.live; document.getElementById("rv-rollback").disabled = !lb; document.getElementById("rv-discard").disabled = !rv.count;
}
/* restart when idle: the server writes the plist and restarts the proxy only at 0 requests in
   progress after the idle window; a failed health check restores the old plist by itself */
const RS = {timer: null};
function restartPanel(proxy){
  const box = h("div", {class: "rs", "aria-live": "polite"});
  const idle = h("input", {type: "number", min: "60", step: "30", value: "120", "aria-label": "idle seconds before restart", class: "num"});
  const state = h("div", {class: "rs-state", text: "Checking the proxy…"});
  const go = h("button", {class: "btn primary", type: "button", text: "Apply + restart when idle"});
  const cancel = h("button", {class: "btn", type: "button", text: "Cancel wait"}); cancel.hidden = true;
  async function refresh(){
    let r; try { r = await api(`/api/restart?proxy=${proxy}&idle_s=${Number(idle.value) || 120}`); } catch (e) { state.textContent = e.message; return; }
    const j = r.job || {}; const g = r.gate || {};
    const waiting = j.state === "waiting"; cancel.hidden = !waiting; go.disabled = waiting;
    if (waiting) state.textContent = `Waiting for idle (${(j.gate && j.gate.why) || g.why}). It restarts by itself.`;
    else if (j.state === "done") state.textContent = `Restarted ${r.label} in ${j.result.restart_s}s, healthy. Backup ${j.result.backup}.`;
    else if (j.state === "failed" || j.state === "timeout") state.textContent = `Not restarted: ${j.result && j.result.error}`;
    else state.textContent = (g.ready ? "Ready: " : "Not now: ") + g.why + ".";
    state.className = "rs-state " + (j.state === "done" ? "ok" : (j.state === "failed" ? "err" : (g.ready ? "ok" : "")));
    if (waiting){ clearTimeout(RS.timer); RS.timer = setTimeout(refresh, 3000); }
    else if (j.state === "done"){ const d = await api("/api/draft"); S.draft = d.draft; S.review = d.review; paintSwitches(); }
  }
  go.addEventListener("click", async () => {
    const label = proxy === "main" ? "com.apex-router.serve" : "com.apex.local-qwen-proxy";
    try { await api("/api/restart", {method: "POST", body: {proxy, wait: true, idle_s: Number(idle.value) || 120,
      max_wait_s: 1800, confirm: "restart " + label}}); } catch (e) { state.textContent = e.message; return; }
    refresh();
  });
  cancel.addEventListener("click", async () => { await api(`/api/restart?proxy=${proxy}`, {method: "DELETE"}); refresh(); });
  box.append(h("div", {class: "rs-row"}, go, h("label", {class: "muted"}, "after ", idle, " s with no request"), cancel), state,
    h("p", {class: "muted small", text: "Restart only when no request is in progress and none started for the idle time. The old plist is kept as a backup; if the proxy does not come back healthy, the studio restores it."}));
  refresh();
  return box;
}
async function openReview(){
  try { const r = await api("/api/draft"); S.draft = r.draft; S.review = r.review; } catch (e) { banner("Review: " + e.message, true); }
  paintSwitches(); renderReview(); const d = document.getElementById("review"); if (!d.open) d.showModal();
}
document.getElementById("review-btn").addEventListener("click", openReview);
document.getElementById("rv-close").addEventListener("click", () => document.getElementById("review").close());
document.getElementById("rv-discard").addEventListener("click", async () => { await putDraft({clear: true}); renderReview(); });
document.getElementById("rv-apply").addEventListener("click", async () => {
  let msg;
  try { const r = await api("/api/apply", {method: "POST", body: {}});
    msg = h("div", {class: "msg ok"}, h("b", {text: r.applied.length ? "Applied: " : "Nothing written. "}),
      r.applied.map(a => `${a.file} (${a.keys.length})`).join(", "),
      r.plans.length ? ` · ${r.plans.length} restart plan(s) below: run them yourself. ` : " ",
      h("span", {class: "muted", text: r.applied.length ? "Run /reload in pi to use the new routes." : ""}));
    const d = await api("/api/draft"); S.draft = d.draft; S.review = d.review;
    S.flow = await api("/api/flow?proxy=" + S.proxy); buildCanvas();
  } catch (e) { msg = h("div", {class: "msg err", text: "Apply failed: " + e.message}); }
  renderReview(msg);
});
document.getElementById("rv-rollback").addEventListener("click", async () => {
  let msg;
  try { const r = await api("/api/rollback", {method: "POST", body: {}});
    msg = h("div", {class: "msg ok", text: `Restored ${r.restored.join(", ")} from ${r.backup}.` + (r.warnings.length ? " " + r.warnings.join(" ") : "")});
    const d = await api("/api/draft"); S.draft = d.draft; S.review = d.review;
    S.flow = await api("/api/flow?proxy=" + S.proxy); buildCanvas();
  } catch (e) { msg = h("div", {class: "msg err", text: "Rollback failed: " + e.message}); }
  renderReview(msg);
});

/* ---------- controls + load ---------- */
function setSeg(sel, attr, val){ document.querySelectorAll(sel + " button").forEach(b => b.setAttribute("aria-pressed", b.getAttribute(attr) === val ? "true" : "false")); }
document.getElementById("win-seg").addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return;
  S.win = b.getAttribute("data-win"); setSeg("#win-seg", "data-win", S.win); loadLive(); });
document.getElementById("proxy-seg").addEventListener("click", async ev => { const b = ev.target.closest("button"); if (!b) return;
  S.proxy = b.getAttribute("data-proxy"); setSeg("#proxy-seg", "data-proxy", S.proxy); await loadFlow(); loadLive(); });
async function loadFlow(){
  try { S.flow = await api("/api/flow?proxy=" + S.proxy); buildCanvas(); }
  catch (e) { banner("Cannot load the flow: " + e.message, true); }
}
async function loadLive(){
  try { S.live = await api(`/api/live?window=${S.win}&proxy=${S.proxy}`); paintLive(); }
  catch (e) { banner("Live numbers not available: " + e.message, true); }
}
(async function init(){
  const q = new URLSearchParams(location.search);
  if (q.get("window") && ["15m", "1h", "24h"].includes(q.get("window"))){ S.win = q.get("window"); setSeg("#win-seg", "data-win", S.win); }
  try { const r = await api("/api/draft"); S.draft = r.draft; S.review = r.review; } catch (e) { S.draft = {changes: {}}; }
  await loadFlow(); await loadLive();
  setInterval(loadLive, 15000);
  // deep links (also used for screenshots): #node=<id>  #test=<prompt>  #review  #branches
  const hsh = new URLSearchParams(location.hash.slice(1));
  if (hsh.has("branches")) toggleBranches();
  if (hsh.get("test")){ document.getElementById("test-in").value = hsh.get("test"); await runTest(hsh.get("test")); }
  if (hsh.get("node") && nodeById(hsh.get("node"))) openInspector(hsh.get("node"));
  if (hsh.has("review")) openReview();
})();
</script>
